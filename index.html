/**
 * Словесная сводка «Пульса месяца» для скринридера.
 * Озвучивать 31 полосу по очереди хуже, чем не озвучивать вовсе,
 * поэтому SVG отдаёт один вывод: пик, перерасходы, пустые дни.
 * Подписи <title> у полос при этом остаются — для мыши и касания.
 */
function pulseSummary(s, m, dm, dayBudget, peakKey) {
  const days = Object.keys(s.byDay).filter(k => ym(k) === m);
  const spent = days.filter(k => s.byDay[k] > 0);
  if (!spent.length) return `Траты по дням месяца: за ${dm} ${plural(dm, "день", "дня", "дней")} трат не было.`;
  const over = dayBudget > 0 ? spent.filter(k => s.byDay[k] > dayBudget).length : 0;
  const zero = dm - spent.length;
  const peak = peakKey ? `Самый крупный день — ${+peakKey.slice(8, 10)} ${MONTHS_SHORT[+m.slice(5, 7) - 1]}, ${fmtShort(s.byDay[peakKey])}.` : "";
  return `Траты по дням месяца, ${dm} ${plural(dm, "день", "дня", "дней")}. ${peak}`
    + (over ? ` Выше дневного лимита ${over} ${plural(over, "день", "дня", "дней")}.` : "")
    + (zero ? ` Без трат ${zero} ${plural(zero, "день", "дня", "дней")}.` : "");
}

/* ---------------- Сводка ---------------- */
function viewHome() {
  const m = S.ui.month, s = monthStats(m), cur = ym(todayStr());
  const dm = daysInMonth(m);
  const isCur = m === cur;
  const dayNow = isCur ? new Date().getDate() : dm;
  const bud = budgetTotal();
  const forecast = dayNow > 0 ? s.exp / dayNow * dm : 0;
  const left = bud > 0 ? bud - s.exp : 0;
  const daysLeft = Math.max(1, dm - dayNow + (isCur ? 1 : 0));
  /* Резерв под ещё не списанные обязательные платежи.
     Без него «можно тратить в день» завышен всю первую половину месяца:
     остаток бюджета делится на дни, как будто аренда и садик уже оплачены.
     Резерв = сумма невыбранных лимитов обязательных категорий. */
  const upcomingFixed = bud > 0 ? S.cats.reduce((sum, c) =>
    sum + (c.kind === "expense" && c.fixed && +c.budget > 0
      ? Math.max(0, +c.budget - (s.byCat[c.id] || 0)) : 0), 0) : 0;
  const perDay = bud > 0 ? (left - upcomingFixed) / daysLeft : 0;
  const bals = balances();

  $("top").innerHTML = monthNav("сводка");

  /* Пульс месяца — сигнатурная полоса */
  const maxDay = Math.max(1, ...Object.values(s.byDay));
  const dayBudget = bud > 0 ? bud / dm : maxDay * 0.6;
  /* Шкала линейная: длина полосы обязана быть пропорциональна сумме.
     Прежний корень занижал выбросы — день 5,9 млн против медианных 513 тыс
     это 11,5× по деньгам, но всего 3,4× по высоте, и главный смысл графика
     («вот день, который убил месяц») пропадал.
     Чтобы аренда не расплющила остальные дни, верх шкалы обрезан по 90-му
     процентилю трат, но не ниже полутора дневных лимитов. Полосы выше среза
     рисуются до потолка и помечаются прорезью — приём «разорванной полосы». */
  const spentDays = Object.values(s.byDay).filter(v => v > 0).sort((a, b) => a - b);
  const peakKey = Object.keys(s.byDay).reduce((a, k) => (s.byDay[k] > (s.byDay[a] || 0) ? k : a), "");
  const p90 = spentDays.length ? spentDays[Math.min(spentDays.length - 1, Math.floor(spentDays.length * 0.9))] : 1;
  const capDay = Math.max(1, dayBudget > 0 ? Math.max(p90, dayBudget * 1.5) : p90);
  const yScale = v => Math.min(1, Math.max(0, v) / capDay) * (H - 8);
  let clipped = 0;
  const W = 100, H = 62, gap = 0.5;
  const bw = (W - gap * (dm - 1)) / dm;
  let bars = "";
  const incDays = {};
  S.tx.forEach(t => { if (t.kind === "income" && ym(t.date) === m) incDays[+t.date.slice(8, 10)] = 1; });
  for (let d = 1; d <= dm; d++) {
    const key = m + "-" + pad2(d), v = s.byDay[key] || 0;
    const x = (d - 1) * (bw + gap);
    const h = v > 0 ? Math.max(2, yScale(v)) : 0;
    const future = isCur && d > dayNow;
    const col = v === 0 ? "rgba(255,255,255,.06)" : (v > dayBudget * 1.6 ? "var(--pom)" : v > dayBudget ? "var(--saffron)" : "var(--turq)");
    /* Статус дня кодируется не только цветом: подпись доступна по нажатию
       и читается скринридером — красный и зелёный при дейтеранопии
       различаются слабо (ΔE 4). */
    const status = v === 0 ? "без трат" : v > dayBudget * 1.6 ? "сильно выше лимита"
      : v > dayBudget ? "выше лимита" : "в пределах лимита";
    const over = v > capDay;
    if (over) clipped++;
    const tip = `<title>${d} ${MONTHS_SHORT[+m.slice(5, 7) - 1]} · ${fmtShort(v)} · ${status}${over ? " · выброс за шкалу" : ""}</title>`;
    if (h > 0) {
      bars += `<rect class="d" x="${x.toFixed(2)}" y="${(H - h).toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}" rx="${Math.min(0.9, bw / 2).toFixed(2)}" fill="${col}" style="animation-delay:${d * 9}ms">${tip}</rect>`;
      /* Прорезь цветом карточки: полоса упёрлась в потолок, настоящая сумма больше */
      if (over) bars += `<rect x="${x.toFixed(2)}" y="${(H - h + 2.2).toFixed(2)}" width="${bw.toFixed(2)}" height="1.3" fill="var(--ink2)" aria-hidden="true"/>`;
    }
    else bars += `<rect x="${x.toFixed(2)}" y="${H - 1.6}" width="${bw.toFixed(2)}" height="1.6" rx=".6" fill="${future ? "rgba(255,255,255,.05)" : "rgba(255,255,255,.11)"}">${tip}</rect>`;
    if (incDays[d]) bars += `<rect x="${x.toFixed(2)}" y="0" width="${bw.toFixed(2)}" height="2.6" rx="1" fill="var(--saffron)"><title>${d} ${MONTHS_SHORT[+m.slice(5, 7) - 1]} · был доход</title></rect>`;
  }
  if (bud > 0) {
    /* Линия дневного лимита живёт в той же шкале, что и полосы */
    const y = H - yScale(dayBudget);
    if (y > 2 && y < H) bars += `<line x1="0" x2="${W}" y1="${y.toFixed(2)}" y2="${y.toFixed(2)}" stroke="rgba(255,255,255,.28)" stroke-width=".4" stroke-dasharray="1.5 1.5"/>`;
  }

  const goalsRow = S.goals.filter(g => !g.done).slice(0, 3).map(g => {
    const sv = goalSaved(g), tg = goalTargetBase(g), p = tg > 0 ? Math.min(1, sv / tg) : 0;
    return `<div style="flex:1;min-width:0">
      <div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.name)}</div>
      <div class="bar gold" style="margin-top:5px"><i style="width:${(p * 100).toFixed(1)}%"></i></div>
      <div class="dim num" style="font-size:11px;margin-top:3px">${Math.round(p * 100)}%</div>
    </div>`;
  }).join("");

  const recent = S.tx.slice().sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id)).slice(0, 5).map(t => txRow(t)).join("");

  return `
  <div class="card">
    <div class="eyebrow">Доступно</div>
    <div class="num big">${nf0.format(Math.round(availableBase()))}<span style="font-size:16px;color:var(--dim)"> сум</span></div>
    <div class="hint">на счетах${(() => {
      const used = CURS.filter(c => c !== BASE && S.accounts.some(a => a.cur === c));
      return used.length ? " · курс " + used.map(c => nf0.format(rateOf(c)) + " за 1" + CUR[c].sym).join(", ") : "";
    })()}</div>
    <hr class="sep">
    ${accList().map(a => `<div class="between" style="padding:4px 0">
        <span class="dim" style="font-size:13px">${a.icon || "•"} ${esc(a.name)}</span>
        <span class="num" style="font-weight:600;font-size:14px">${fmt(bals[a.id] || 0, a.cur)}</span>
      </div>`).join("")}
    ${goalPot() ? `<hr class="sep">
      <div class="between" style="padding:4px 0">
        <span class="dim" style="font-size:13px">◎ Отложено в цели</span>
        <span class="num sf" style="font-weight:600;font-size:14px">${fmt(goalPot(), "UZS")}</span>
      </div>
      <div class="between" style="padding:4px 0">
        <span class="dim" style="font-size:13px">Всего с накоплениями</span>
        <span class="num" style="font-weight:700;font-size:14px">${fmt(totalBase(), "UZS")}</span>
      </div>
      <div class="hint">Отложенное не входит в «доступно» и в дневной лимит: со счетов эти деньги уже списаны.</div>` : ""}
  </div>

  <div class="card">
    <div class="eyebrow">Пульс месяца</div>
    <svg class="pulse" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
         role="img" aria-label="${esc(pulseSummary(s, m, dm, dayBudget, peakKey))}">${bars}</svg>
    <div class="pulse-legend"><span>1</span><span>полоса — день${clipped ? " · прорезь — выброс за шкалу" : " · высота — сумма"}</span><span>${dm}</span></div>
  </div>

  <div class="grid3">
    <div class="card tight"><div class="eyebrow">Доход</div><div class="num mid tq">${statBig(s.inc)}</div></div>
    <div class="card tight"><div class="eyebrow">Расход</div><div class="num mid">${statBig(s.exp)}</div></div>
    <div class="card tight"><div class="eyebrow">Остаток</div><div class="num mid ${s.net >= 0 ? "" : "pm"}">${statBig(s.net)}</div></div>
  </div>

  ${bud > 0 ? `<div class="card">
    <div class="between"><div class="eyebrow" style="margin:0">Бюджет месяца</div>
      <span class="badge">${Math.round(s.exp / bud * 100)}%</span></div>
    <div class="bar ${s.exp > bud ? "over" : s.exp > bud * .8 ? "warn" : ""}" style="margin:10px 0 8px"><i style="width:${Math.min(100, s.exp / bud * 100).toFixed(1)}%"></i></div>
    <div class="grid2" style="gap:8px">
      <div><div class="dim" style="font-size:11.5px">Потрачено из ${fmtShort(bud)}</div>
        <div class="num" style="font-size:14px;font-weight:700;white-space:nowrap">${fmtShort(s.exp)}</div></div>
      <div style="text-align:right"><div class="dim" style="font-size:11.5px">Прогноз на месяц</div>
        <div class="num ${forecast > bud ? "pm" : ""}" style="font-size:14px;font-weight:700;white-space:nowrap">${fmtShort(forecast)}</div></div>
    </div>
    ${isCur ? `<hr class="sep"><div class="between"><span class="dim" style="font-size:12.5px">Можно тратить в день</span>
      <span class="num mid ${perDay < 0 ? "pm" : "tq"}">${fmtShort(perDay)}</span></div>
      <div class="hint">осталось ${daysLeft} ${plural(daysLeft, "день", "дня", "дней")}${upcomingFixed > 0 ? " · в резерве на обязательные " + fmtShort(upcomingFixed) : ""}</div>` : ""}
  </div>` : `<div class="card"><div class="eyebrow">Бюджет не задан</div>
    <div class="hint">Проставь месячные лимиты по категориям в настройках — появится дневной лимит и прогноз.</div>
    <button class="btn ghost sm" data-act="settings" style="margin-top:10px">Открыть настройки</button></div>`}

  ${goalsRow ? `<div class="card"><div class="eyebrow">Цели</div><div class="row" style="align-items:flex-start">${goalsRow}</div></div>` : ""}

  <div class="card">
    <div class="between"><div class="eyebrow" style="margin:0">Последние операции</div>
      <button class="badge" data-act="tab" data-tab="log">весь журнал</button></div>
    <div style="margin-top:6px">${recent || `<div class="empty">Пока пусто. Нажми «+», чтобы записать первую операцию.</div>`}</div>
  </div>`;
}

/* ---------------- Журнал ---------------- */
/**
 * Строка операции. showDate=false для журнала: там дата уже вынесена
 * в заголовок группы, и повтор в каждой строке — чистый шум.
 */
function txRow(t, showDate) {
  if (showDate === undefined) showDate = true;
  const c = cat(t.cat), a = acc(t.acc);
  let icon = c ? c.icon : "•", title = c ? c.name : "Операция", sign = "−", cls = "";
  if (t.kind === "income") { sign = "+"; cls = "tq"; }
  else if (t.kind === "transfer") { icon = "⇄"; title = "Перевод"; sign = ""; cls = "lz"; }
  else if (t.kind === "adjust") {
    icon = "⚖"; title = "Сверка остатка";
    sign = t.amount < 0 ? "−" : "+"; cls = "dim";
  }
  else if (t.kind === "goal") {
    const g = goal(t.goal); icon = "◎";
    if (t.amount < 0) { title = "Возврат из «" + (g ? g.name : "цели") + "»"; sign = "←"; cls = "tq"; }
    else { title = g ? g.name : "Цель удалена"; sign = "→"; cls = "sf"; }
  }
  const sub = [showDate ? t.date.slice(8, 10) + " " + MONTHS_SHORT[+t.date.slice(5, 7) - 1] : "",
    t.kind === "transfer" ? (acc(t.acc) ? acc(t.acc).name : "") + " → " + (acc(t.acc2) ? acc(t.acc2).name : "") : (a ? a.name : ""),
    t.note].filter(Boolean).join(" · ");
  return `<div class="li" data-act="edit" data-id="${t.id}">
    <div class="ic">${icon}</div>
    <div class="t"><b>${esc(title)}</b><span>${esc(sub)}</span></div>
    <div class="v ${cls}">${sign}${nf0.format(Math.abs(Math.round(t.amount)))}${t.cur && t.cur !== BASE ? "\u00A0" + curInfo(t.cur).sym : ""}</div>
  </div>`;
}
function viewLog() {
  $("top").innerHTML = monthNav("журнал");
  const list = S.tx.filter(t => ym(t.date) === S.ui.month).sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  if (!list.length) return `<div class="card"><div class="empty">В этом месяце операций нет.<br>Нажми «+», чтобы добавить.</div></div>`;
  const tip = `<div class="hint" style="text-align:center;margin:0 0 8px">Нажми на операцию, чтобы изменить или удалить её.</div>`;
  const byDate = {};
  list.forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });
  return tip + Object.keys(byDate).sort().reverse().map(d => {
    const day = byDate[d];
    const sum = day.reduce((s, t) => s + (t.kind === "expense" ? toBase(t) : 0), 0);
    const dd = new Date(d);
    return `<div class="card">
      <div class="between"><span class="eyebrow" style="margin:0">${d.slice(8, 10)} ${MONTHS_SHORT[+d.slice(5, 7) - 1]}, ${["вс","пн","вт","ср","чт","пт","сб"][dd.getDay()]}</span>
        <span class="badge num">${sum ? "−" + fmtShort(sum) : "—"}</span></div>
      <div style="margin-top:4px">${day.map(t => txRow(t, false)).join("")}</div>
    </div>`;
  }).join("");
}

/* ---------------- Аналитика ---------------- */
function viewStat() {
  $("top").innerHTML = monthNav("аналитика");
  const m = S.ui.month, s = monthStats(m);
  if (!s.inc && !s.exp && !s.sav) return `<div class="card"><div class="empty">Нет данных за ${monthName(m)}.</div></div>`;

  const cats = catStats(m);
  const maxC = Math.max(1, ...cats.map(x => x.sum));
  const rows = cats.map(x => {
    const bud = +x.c.budget || 0, over = bud > 0 && x.sum > bud;
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div class="between"><span style="font-size:13.5px">${x.c.icon} ${esc(x.c.name)}${x.c.fixed ? ` <span class="badge">обяз.</span>` : ""}</span>
        <span class="num" style="font-weight:700;font-size:13.5px">${fmtShort(x.sum)}</span></div>
      <div class="bar ${over ? "over" : ""}" style="margin-top:6px;height:6px"><i style="width:${(x.sum / maxC * 100).toFixed(1)}%"></i>${bud > 0 && bud < maxC ? `<u style="left:${(bud / maxC * 100).toFixed(1)}%" title="лимит ${fmtShort(bud)}"></u>` : ""}</div>
      <div class="between" style="margin-top:4px">
        <span class="dim num" style="font-size:11px">${x.n}× по ${fmtShort(x.median)}${x.avg / Math.max(1, x.median) >= 1.5 ? " (сред. " + fmtShort(x.avg) + ")" : ""}</span>
        <span class="dim" style="font-size:11px">${(x.sum / s.exp * 100).toFixed(0)}%${bud > 0 ? (over ? " · перебор " + fmtShort(x.sum - bud) : " · остаток " + fmtShort(bud - x.sum)) : ""}</span>
      </div></div>`;
  }).join("");

  /* Тренд 6 месяцев */
  const ser = [];
  for (let i = 5; i >= 0; i--) { const mm = shiftMonth(m, -i); const st = monthStats(mm); ser.push({ m: mm, i: st.inc, e: st.exp }); }
  /* Месяцы до начала истории — пустые слоты, которые нечего показывать */
  while (ser.length > 1 && !ser[0].i && !ser[0].e) ser.shift();
  const mx = Math.max(1, ...ser.map(x => Math.max(x.i, x.e)));
  const W = 100, H = 46, step = W / ser.length;
  const trend = ser.map((x, k) => {
    const bx = k * step + step * .12, bw = step * .34;
    const hi = x.i / mx * H, he = x.e / mx * H;
    return `<rect x="${bx.toFixed(2)}" y="${(H - hi).toFixed(2)}" width="${bw.toFixed(2)}" height="${hi.toFixed(2)}" rx=".8" fill="var(--turq)"/>
            <rect x="${(bx + bw + step * .06).toFixed(2)}" y="${(H - he).toFixed(2)}" width="${bw.toFixed(2)}" height="${he.toFixed(2)}" rx=".8" fill="var(--pom)"/>`;
  }).join("");

  const sr = s.inc > 0 ? (s.inc - s.exp) / s.inc : 0;
  const dm = daysInMonth(m);
  const DS = dayStats(m);
  const ae = avgExpense(3);
  const months = ae > 0 ? totalBase() / ae : 0;
  const dots = Array.from({ length: 12 }, (_, i) =>
    `<i class="${months >= i + 1 ? "on" : months > i ? "half" : ""}"></i>`).join("");

  const top = S.tx.filter(t => ym(t.date) === m && t.kind === "expense")
    .sort((a, b) => toBase(b) - toBase(a)).slice(0, 5);

  return `
  <div class="grid2">
    <div class="card tight"><div class="eyebrow">Норма сбережений</div>
      <div class="num mid ${sr >= .2 ? "tq" : sr >= 0 ? "sf" : "pm"}">${(sr * 100).toFixed(0)}%</div>
      <div class="hint">ориентир — от 20%</div></div>
    <div class="card tight"><div class="eyebrow">Обязательные</div>
      <div class="num mid">${s.exp ? (s.fixed / s.exp * 100).toFixed(0) : 0}%</div>
      <div class="hint">${fmtShort(s.fixed)} из ${fmtShort(s.exp)}</div></div>
    <div class="card tight"><div class="eyebrow">Типичный день</div>
      <div class="num mid">${fmtShort(DS.median)}</div>
      <div class="hint">медиана по календарю<br>когда трачу — ${fmtShort(DS.medianActive)}</div></div>
    <div class="card tight"><div class="eyebrow">Дни без трат</div>
      <div class="num mid ${DS.zero ? "tq" : ""}">${DS.zero}</div>
      <div class="hint">из ${DS.days} · подряд сейчас ${DS.streak}, рекорд ${DS.best}</div></div>
  </div>

  ${DS.median > 0 && DS.mean / DS.median >= 1.6 ? `<div class="card tight">
    <div class="eyebrow">Почему средний день врёт</div>
    <div class="hint">Средний день ${fmtShort(DS.mean)} — это ${dec(DS.mean / DS.median, 1)}× от типичного ${fmtShort(DS.median)}: несколько крупных платежей тянут его вверх. Самый большой день месяца — ${fmtShort(DS.max)}. Ориентируйся на медиану.</div>
  </div>` : ""}

  <div class="card">
    <div class="eyebrow">Месяцев свободы</div>
    <div class="row"><div class="num big">${dec(months, 1)}</div>
      <div class="hint" style="margin:0">накопления ${fmtShort(totalBase())}<br>делённые на средний расход ${fmtShort(ae)}</div></div>
    <div class="dots">${dots}</div>
  </div>

  <div class="card">
    <div class="between" style="margin-bottom:8px">
      <div class="eyebrow" style="margin:0">Доход и расход, ${ser.length} ${plural(ser.length, "месяц", "месяца", "месяцев")}</div>
      <span class="badge">до ${fmtShort(mx)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:74px;display:block"
         role="img" aria-label="Доход и расход по месяцам, максимум шкалы ${fmtShort(mx)}">${trend}</svg>
    <div class="pulse-legend">${ser.map(x => `<span>${MONTHS_SHORT[+x.m.slice(5, 7) - 1]}</span>`).join("")}</div>
    <div class="row" style="margin-top:8px;font-size:11.5px;color:var(--dim)">
      <span class="tq">■</span> доход <span class="pm" style="margin-left:8px">■</span> расход</div>
  </div>

  <div class="card"><div class="eyebrow">Структура расходов</div>${rows || `<div class="empty">Расходов нет.</div>`}</div>

  ${(() => {   /* Рост категорий месяц к месяцу */
    const G = catGrowth(m);
    if (!G) return `<div class="card tight"><div class="eyebrow">Рост категорий</div>
      <div class="hint">Нужен полный предыдущий месяц для сравнения. Появится, когда накопится второй месяц данных.</div></div>`;
    const up = G.rows.filter(r => r.delta > 0).slice(0, 5);
    const down = G.rows.filter(r => r.delta < 0).slice(-4).reverse();
    const line = r => `<div class="between" style="padding:6px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:13px">${r.c.icon} ${esc(r.c.name)}</span>
        <span class="num" style="font-size:12.5px;white-space:nowrap">
          <span class="dim">${fmtShort(r.was)} → ${fmtShort(r.now)}</span>
          <b class="${r.delta > 0 ? "pm" : "tq"}" style="margin-left:7px">${r.delta > 0 ? "+" : "−"}${r.pct == null ? fmtShort(Math.abs(r.delta)) : Math.abs(r.pct).toFixed(0) + "%"}</b></span>
      </div>`;
    return `<div class="card">
      <div class="between" style="margin-bottom:8px">
        <div class="eyebrow" style="margin:0">Рост категорий к прошлому месяцу</div>
        <span class="badge">${G.full ? "весь месяц" : "1–" + G.day + " числа"}</span></div>
      ${G.full ? "" : `<div class="hint" style="margin:0 0 6px">Сравниваются первые ${G.day} ${plural(G.day, "день", "дня", "дней")} обоих месяцев — иначе платёж по числу (аренда, садик, связь) давал бы мнимый рост.</div>`}
      ${up.map(line).join("") || `<div class="hint">Растущих категорий нет.</div>`}
      ${down.length ? `<div class="eyebrow" style="margin:12px 0 0">Снизились</div>${down.map(line).join("")}` : ""}
    </div>`;
  })()}

  ${(() => {   /* Регулярные платежи и постоянные расходы */
    const R = recurring(), F = fixedCosts();
    const perMonth = F.reduce((a, b) => a + b.perMonth, 0);
    const hourly = (+S.settings.hours || 176) > 0 ? baseline(3).inc / (+S.settings.hours || 176) : 0;
    if (!R.length && !F.length) return "";
    return `<div class="card">
      <div class="eyebrow">Постоянные расходы</div>
      ${F.length && F[0].partial ? `<div class="hint" style="margin:0 0 6px">Пока считаю по незакрытому месяцу — завершённых с расходами ещё нет.</div>` : ""}
      <div class="fx-head"><span></span><span>в месяц</span><span>в год</span></div>
      ${F.map(x => `<div class="fx-row">
          <span class="nm">${x.c.icon} ${esc(x.c.name)}</span>
          <span class="num">${fmtShort(x.perMonth)}</span>
          <span class="num dim">${fmtShort(x.perMonth * 12)}</span>
        </div>`).join("")}
      ${perMonth > 0 ? `<div class="between" style="margin-top:9px">
        <span class="dim" style="font-size:12.5px">Итого обязательных</span>
        <span class="num" style="font-weight:700">${fmtShort(perMonth)} / мес</span></div>
        ${hourly > 0 ? `<div class="hint">Это ${Math.round(perMonth / hourly)} ${plural(Math.round(perMonth / hourly), "рабочий час", "рабочих часа", "рабочих часов")} каждый месяц при цене часа ${fmtShort(hourly)}.</div>` : ""}` : ""}
      ${R.length ? `<div class="eyebrow" style="margin:13px 0 0">Найденные повторы</div>
        ${R.slice(0, 6).map(r => `<div class="between" style="padding:6px 0;border-bottom:1px solid var(--line)">
            <span style="font-size:13px">${r.c.icon} ${esc(r.c.name)}</span>
            <span class="num" style="font-size:12.5px;white-space:nowrap">${fmtShort(r.avg)}<span class="dim"> × ${r.times} за ${r.months} мес</span></span>
          </div>`).join("")}`
        : `<div class="hint" style="margin-top:10px">Повторы ищутся по совпадающим суммам в разных месяцах — нужен второй месяц истории.</div>`}
    </div>`;
  })()}

  ${(() => {   /* График капитала */
    const pts = [];
    for (let i = 5; i >= 0; i--) {
      const mm = shiftMonth(m, -i);
      const last = mm + "-" + pad2(daysInMonth(mm));
      pts.push({ m: mm, v: capitalAt(last > todayStr() ? todayStr() : last) });
    }
    if (!pts.some(p => p.v)) return "";
    const lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(1, ...pts.map(p => p.v));
    const W = 100, H = 44, span = hi - lo || 1;
    const xy = pts.map((p, i) => [i * (W / (pts.length - 1)), H - (p.v - lo) / span * H]);
    const path = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = path + ` L${W} ${H} L0 ${H} Z`;
    const zeroY = H - (0 - lo) / span * H;
    const first = pts.find(p => p.v), delta = pts[pts.length - 1].v - (first ? first.v : 0);
    return `<div class="card">
      <div class="eyebrow">Капитал по месяцам</div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:70px;display:block">
        <path d="${area}" fill="rgba(58,140,90,.16)"/>
        ${lo < 0 ? `<line x1="0" x2="${W}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}" stroke="rgba(255,255,255,.22)" stroke-width=".4" stroke-dasharray="1.5 1.5"/>` : ""}
        <path d="${path}" fill="none" stroke="var(--turq)" stroke-width="1.1" stroke-linejoin="round"/>
        ${/* Минус помечен не только цветом: точка крупнее и в светлом кольце,
              плюс подпись в <title> — красный и зелёный при дейтеранопии почти совпадают. */
          xy.map((p, i) => {
            const neg = pts[i].v < 0;
            return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${neg ? 2 : 1.4}"`
              + ` fill="${neg ? "var(--pom)" : "var(--turq2)"}"`
              + (neg ? ` stroke="var(--text)" stroke-width=".7"` : "")
              + `><title>${MONTHS_SHORT[+pts[i].m.slice(5, 7) - 1]} · ${fmtShort(pts[i].v)}</title></circle>`;
          }).join("")}
      </svg>
      <div class="pulse-legend">${pts.map(p => `<span>${MONTHS_SHORT[+p.m.slice(5, 7) - 1]}</span>`).join("")}</div>
      <div class="between" style="margin-top:8px">
        <span class="dim" style="font-size:12.5px">Сейчас</span>
        <span class="num mid ${pts[pts.length - 1].v < 0 ? "pm" : ""}">${fmtShort(pts[pts.length - 1].v)}</span></div>
      ${delta ? `<div class="hint">За период ${delta >= 0 ? "прирост" : "убыль"} ${fmtShort(Math.abs(delta))}. Считается из операций: счета плюс отложенное в незакрытых целях.</div>` : ""}
    </div>`;
  })()}

  ${top.length ? `<div class="card"><div class="eyebrow">Крупнейшие траты месяца</div>${top.map(t => txRow(t)).join("")}</div>` : ""}`;
}

/* ---------------- Цели ---------------- */
function viewGoals() {
  $("top").innerHTML = header("Цели", "накопления", true);
  const active = S.goals.filter(g => !g.done), done = S.goals.filter(g => g.done);
  const ae = avgExpense(3);
  const pace = paceMonthly();

  const cardOf = g => {
    const sv = goalSaved(g), tg = goalTargetBase(g), p = tg > 0 ? Math.min(1, sv / tg) : 0;
    const rest = Math.max(0, tg - sv);
    let eta = "—";
    if (rest <= 0) eta = "цель закрыта";
    else if (pace > 0) {
      const k = Math.ceil(rest / pace);
      const d = new Date(); d.setMonth(d.getMonth() + k);
      eta = `≈ ${k} ${plural(k, "месяц", "месяца", "месяцев")} · ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    }
    let need = "";
    if (g.deadline && rest > 0) {
      const dl = new Date(g.deadline), now = new Date();
      const k = Math.max(1, Math.round((dl - now) / 2629800000));
      need = `Чтобы успеть к ${fmtDate(g.deadline)}: ${fmtShortCur(rest / rateOf(g.cur) / k, g.cur)} в месяц`;
    }
    return `<div class="card">
      <div class="between"><b style="font-size:16px">${esc(g.name)}</b>
        <button class="badge" data-act="goal-edit" data-id="${g.id}">изменить</button></div>
      <div class="row" style="margin:10px 0 8px;align-items:baseline">
        <div class="num mid sf">${fmt(sv / rateOf(g.cur), g.cur)}</div>
        <div class="dim" style="font-size:13px">из ${fmt(g.target, g.cur)}</div>
      </div>
      <div class="bar gold"><i style="width:${(p * 100).toFixed(1)}%"></i></div>
      <div class="between" style="margin-top:7px">
        <span class="dim" style="font-size:12px">${Math.round(p * 100)}% · осталось ${fmtShortCur(rest / rateOf(g.cur), g.cur)}</span>
        <span class="dim num" style="font-size:12px">${eta}</span></div>
      ${need ? `<div class="hint">${esc(need)}</div>` : ""}
      ${+g.initial > 0 ? `<div class="hint">Включая ${fmtShortCur((+g.initial) / rateOf(g.cur), g.cur)}, отложенные до начала учёта — этих денег на счетах никогда не было, поэтому в строку «Отложено в цели» на сводке они не входят.</div>` : ""}
      ${rest > 0
        ? `<button class="btn sm" data-act="add" data-kind="goal" data-goal="${g.id}" style="margin-top:11px">Пополнить</button>`
        : `<button class="btn ghost sm" data-act="goal-done" data-id="${g.id}" style="margin-top:11px">Цель собрана — закрыть</button>`}
    </div>`;
  };

  return `
  <div class="card">
    <div class="eyebrow">Запас прочности</div>
    ${safetyBlock(ae, pace)}
  </div>
  ${active.map(cardOf).join("") || `<div class="card"><div class="empty">Целей пока нет. Добавь первую — квартира, машина, резерв, отпуск.</div></div>`}
  <button class="btn ghost" data-act="goal-new">Новая цель</button>
  ${done.length ? `<div class="card" style="margin-top:10px"><div class="eyebrow">Закрытые</div>${done.map(g =>
      `<div class="li"><div class="ic">✓</div><div class="t"><b>${esc(g.name)}</b><span>${fmt(g.target, g.cur)}</span></div>
       <button class="badge" data-act="goal-edit" data-id="${g.id}">···</button></div>`).join("")}</div>` : ""}`;
}
/** Средний темп сбережений в месяц (базовая валюта) за 3 завершённых месяца */
function paceMonthly() {
  const cur = ym(todayStr());
  let s = 0, k = 0;
  for (let i = 1; i <= 3; i++) {
    const st = monthStats(shiftMonth(cur, -i));
    if (st.exp > 0) { s += (st.inc - st.exp); k++; }
  }
  if (!k) { const st = monthStats(cur); return Math.max(0, st.inc - st.exp); }
  return Math.max(0, s / k);
}
function safetyBlock(ae, pace) {
  const need = ae * (+S.settings.safety || 6);
  const have = totalBase();
  const p = need > 0 ? Math.min(1, have / need) : 0;
  const rest = Math.max(0, need - have);
  let eta = "—";
  if (rest <= 0) eta = "собрана";
  else if (pace > 0) {
    const k = Math.ceil(rest / pace); const d = new Date(); d.setMonth(d.getMonth() + k);
    eta = `≈ ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
  }
  return `<div class="row" style="align-items:baseline"><div class="num big">${Math.round(p * 100)}%</div>
      <div class="hint" style="margin:0">${fmtShort(have)} из ${fmtShort(need)}<br>${S.settings.safety} ${plural(S.settings.safety, "месяц", "месяца", "месяцев")} × ${fmtShort(ae)}</div></div>
    <div class="bar" style="margin-top:10px"><i style="width:${(p * 100).toFixed(1)}%"></i></div>
    <div class="between" style="margin-top:7px"><span class="dim" style="font-size:12px">темп ${fmtShort(pace)} в месяц</span>
      <span class="dim num" style="font-size:12px">${eta}</span></div>`;
}

/* ---------------- Доход ---------------- */
function viewIncome() {
  $("top").innerHTML = header("Доход", "рост и мотивация", true);
  const cur = ym(todayStr());
  const s = monthStats(cur);
  const target = +S.settings.incomeTarget || 0;
  const ser = incomeSeries(12);
  const past = ser.slice(0, 11).filter(x => x.v > 0);
  /* Рекорд, среднее, серия и лестница считаются ТОЛЬКО по закрытым месяцам,
     «Цель месяца» — по текущему. Пока рекорд брался по всему ряду, включая
     незакрытый месяц, экран говорил «рекорд — август» и тут же
     «до рекорда 13,0 млн»: одна метрика по текущему месяцу, другая
     по трём прошлым. Текущий месяц теперь выносится отдельной строкой. */
  const record = Math.max(0, ...past.map(x => x.v));
  const recMonth = past.find(x => x.v === record);
  const aheadOfRecord = record > 0 && s.inc > record;
  /* Среднее берём из baseline(): он отбрасывает месяцы-обрывки — те,
     где доход есть, а расходов ноль (первый неполный месяц учёта).
     Раньше здесь был свой подсчёт с фильтром только по доходу, из-за
     чего 12-дневный июль входил в среднее полным весом, а «цена часа»
     на «Доходе» и в «Аналитике» показывала два разных числа. */
  const B3 = baseline(3);
  const avg3 = B3.months ? B3.inc : s.inc;
  const dm = daysInMonth(cur), day = new Date().getDate(), daysLeft = Math.max(1, dm - day + 1);
  const gap = Math.max(0, target - s.inc);
  const hourly = (+S.settings.hours || 176) > 0 ? avg3 / (+S.settings.hours || 176) : 0;
  const winLabel = B3.months ? B3.months + " " + plural(B3.months, "закрытый", "закрытых", "закрытых") : "текущий";

  /* серия растущих месяцев */
  let streak = 0;
  for (let i = 1; i < ser.length - 1; i++) {
    const a = ser[ser.length - 1 - i], b = ser[ser.length - 2 - i];
    if (a.v > 0 && b.v > 0 && a.v >= b.v) streak++; else break;
  }

  /* лестница уровней — считается от твоей цели, не от абстрактных сумм */
  const LV = [["Старт", .5], ["База", .75], ["Цель", 1], ["Рост", 1.25], ["Прорыв", 1.5]];
  const reached = target > 0 ? LV.filter(l => avg3 >= target * l[1]).length : 0;
  const next = target > 0 && reached < LV.length ? LV[reached] : null;

  /* спарклайн 12 мес */
  const mx = Math.max(1, ...ser.map(x => x.v));
  const W = 100, H = 40, st = W / 12;
  const spark = ser.map((x, k) => {
    const h = x.v / mx * H;
    const isRec = x.v === record && record > 0;
    return `<rect x="${(k * st + st * .18).toFixed(2)}" y="${(H - h).toFixed(2)}" width="${(st * .64).toFixed(2)}" height="${Math.max(h, .8).toFixed(2)}" rx=".8" fill="${isRec ? "var(--saffron)" : "var(--turq)"}" opacity="${x.v ? 1 : .25}"/>`;
  }).join("") + (target > 0 && target / mx <= 1 ? `<line x1="0" x2="${W}" y1="${(H - target / mx * H).toFixed(2)}" y2="${(H - target / mx * H).toFixed(2)}" stroke="var(--saffron)" stroke-width=".5" stroke-dasharray="2 2"/>` : "");

  return `
  ${target > 0 ? `<div class="card">
    <div class="between"><div class="eyebrow" style="margin:0">Цель месяца · ${MONTHS[+cur.slice(5, 7) - 1]}</div><span class="badge">${Math.round(s.inc / target * 100)}%</span></div>
    <div class="row" style="margin:8px 0 10px;align-items:baseline">
      <div class="num big ${s.inc >= target ? "tq" : "sf"}">${fmtShort(s.inc)}</div>
      <div class="dim" style="font-size:13px">из ${fmtShort(target)}</div></div>
    <div class="bar ${s.inc >= target ? "" : "gold"}"><i style="width:${Math.min(100, s.inc / target * 100).toFixed(1)}%"></i></div>
    ${gap > 0 ? `<div class="between" style="margin-top:9px">
        <span class="dim" style="font-size:12.5px">Не хватает ${fmtShort(gap)}</span>
        <span class="num sf" style="font-size:13px">${fmtShort(gap / daysLeft)} в день</span></div>
      <div class="hint">осталось ${daysLeft} ${plural(daysLeft, "день", "дня", "дней")} до конца месяца</div>`
      : `<div class="hint tq" style="margin-top:9px">Цель закрыта. Сверх плана: ${fmtShort(s.inc - target)}</div>`}
  </div>` : `<div class="card"><div class="eyebrow">Цель по доходу не задана</div>
    <div class="hint">Поставь месячную цель — появится разрыв в сумме на день, лестница уровней и серия роста.</div>
    <button class="btn ghost sm" data-act="settings" style="margin-top:10px">Задать цель</button></div>`}

  <div class="grid2">
    <div class="card tight"><div class="eyebrow">Рекорд закрытых</div>
      <div class="num mid">${fmtShort(record)}</div>
      <div class="hint">${recMonth && record > 0 ? monthName(recMonth.m) : "—"}${aheadOfRecord ? `<br><span class="tq">этот месяц уже выше: ${fmtShort(s.inc)}</span>` : ""}</div></div>
    <div class="card tight"><div class="eyebrow">Среднее, ${winLabel}</div>
      <div class="num mid">${fmtShort(avg3)}</div>
      <div class="hint">${record > 0 && avg3 < record ? "до рекорда " + fmtShort(record - avg3) : "на уровне рекорда"}</div></div>
    <div class="card tight"><div class="eyebrow">Цена часа</div>
      <div class="num mid">${fmtShort(hourly)}</div>
      <div class="hint">${winLabel} ÷ ${S.settings.hours} ч</div></div>
    <div class="card tight"><div class="eyebrow">Серия роста</div>
      <div class="num mid ${streak > 0 ? "tq" : ""}">${streak}</div>
      <div class="hint">${plural(streak, "закрытый месяц подряд", "закрытых месяца подряд", "закрытых месяцев подряд")} без падения</div></div>
  </div>

  ${target > 0 ? `<div class="card">
    <div class="between" style="margin-bottom:8px">
      <div class="eyebrow" style="margin:0">Лестница уровней</div>
      <span class="badge">по ${winLabel}</span></div>
    <div class="lvl">${LV.map((l, i) => `<i class="${i < reached ? "on" : ""}"></i>`).join("")}</div>
    <div class="pulse-legend" style="margin-top:6px">${LV.map((l, i) => `<span class="${i === reached - 1 ? "lvl-now" : ""}">${l[0]}</span>`).join("")}</div>
    <div class="hint" style="margin-top:8px">${reached ? `Текущий уровень — <b>${LV[reached - 1][0]}</b>. ` : "Пока ниже первого уровня. "}${next ? `Следующий — <b>${next[0]}</b> при среднем доходе ${fmtShort(target * next[1])} в месяц, это ещё +${fmtShort(target * next[1] - avg3)}.` : "Верхний уровень взят."}</div>
  </div>` : ""}

  ${(() => {   /* Структура дохода по источникам */
    const M3 = incomeMix(3), M1 = incomeMix(1);
    if (!M3.total) return "";
    const top = M3.rows[0];
    const conc = top ? top.v / M3.total * 100 : 0;
    return `<div class="card">
      <div class="eyebrow">Откуда приходят деньги, 3 месяца</div>
      ${M3.rows.map(x => {
        const share = x.v / M3.total * 100;
        const nowV = (M1.rows.find(y => y.c.id === x.c.id) || {}).v || 0;
        return `<div style="padding:7px 0;border-bottom:1px solid var(--line)">
          <div class="between"><span style="font-size:13.5px">${x.c.icon} ${esc(x.c.name)}</span>
            <span class="num" style="font-weight:700;font-size:13.5px">${fmtShort(x.v)}</span></div>
          <div class="bar" style="margin-top:5px;height:6px"><i style="width:${share.toFixed(1)}%"></i></div>
          <div class="between" style="margin-top:4px">
            <span class="dim num" style="font-size:11px">${share.toFixed(0)}% дохода</span>
            <span class="dim num" style="font-size:11px">${nowV ? "в этом месяце " + fmtShort(nowV) : "в этом месяце не было"}</span></div>
        </div>`;
      }).join("")}
      <div class="hint" style="margin-top:9px">${conc >= 85
        ? `Один источник даёт ${conc.toFixed(0)}% дохода. Любой сбой в нём обнуляет месяц целиком — второй источник важнее прибавки к первому.`
        : conc >= 60 ? `Основной источник — ${conc.toFixed(0)}%. Диверсификация началась, но зависимость ещё высокая.`
        : `Доход распределён между источниками, максимальная доля ${conc.toFixed(0)}%.`}</div>
    </div>`;
  })()}

  <div class="card">
    <div class="eyebrow">Доход по месяцам, 12 месяцев</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:70px;display:block">${spark}</svg>
    <div class="pulse-legend">${ser.filter((_, i) => i % 2 === 0).map(x => `<span>${MONTHS_SHORT[+x.m.slice(5, 7) - 1]}</span>`).join("")}</div>
    ${past.length >= 2 ? (() => {
      const first = past[0].v, last = past[past.length - 1].v;
      const g = first > 0 ? (last / first - 1) * 100 : 0;
      return `<div class="hint" style="margin-top:8px">За период доход ${g >= 0 ? "вырос" : "снизился"} на <b class="${g >= 0 ? "tq" : "pm"}">${Math.abs(g).toFixed(0)}%</b> — с ${fmtShort(first)} до ${fmtShort(last)}.</div>`;
    })() : ""}
  </div>

  ${(() => {
    /* Всё строится на тождестве: сбережения = доход − расход.
       Ни средняя норма сбережений, ни деление на неё здесь не участвуют:
       дополнительный доход при неизменных расходах оседает целиком. */
    const B = baseline(3);
    if (!B.inc && !B.exp) return "";
    const gap = B.inc - B.exp;
    const cut = B.exp * 0.1;
    const tax = Math.min(90, Math.max(0, +S.settings.tax || 0)) / 100;
    const gross = cut / (1 - tax);
    const months = Math.max(1, +S.settings.safety || 6);
    const row = (a, b) => `<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:12.5px;padding-right:10px">${a}</span>
        <span class="num" style="font-weight:700;font-size:13.5px;white-space:nowrap">${b}</span></div>`;
    return `<div class="card">
      <div class="eyebrow">Что двигает результат</div>
      <div class="hint" style="margin:0 0 8px">${B.partial
        ? "Считаю по текущему месяцу — завершённых пока нет, цифры будут скакать."
        : `Считаю по среднему за ${B.months} ${plural(B.months, "завершённый месяц", "завершённых месяца", "завершённых месяцев")}: доход ${fmtShort(B.inc)}, расход ${fmtShort(B.exp)}.`}</div>
      ${row(gap >= 0 ? "Откладывается в месяц" : "Расходы превышают доходы на", `<span class="${gap >= 0 ? "tq" : "pm"}">${fmtShort(Math.abs(gap))}</span>`)}
      ${row("Доход больше на 1 млн при тех же расходах", `<span class="tq">+${fmtShort(1e6)}</span> в месяц`)}
      ${row("То же за год", `<span class="tq">+${fmtShort(12e6)}</span>`)}
      ${row("Расходы меньше на 10%", `<span class="tq">+${fmtShort(cut)}</span> в месяц`)}
      ${row("Столько же через оклад — грязными", `${fmtShort(gross)}`)}
      ${row("Если урезана постоянная трата — цель по подушке падает на", `<span class="sf">${fmtShort(cut * months)}</span>`)}
      <div class="hint" style="margin-top:9px">Сум сокращённого расхода и сум дополнительного чистого дохода дают одинаковый результат. Разница в том, что расход облагается налогом ${Math.round(tax * 100)}% только в виде дохода, постоянную трату режут один раз навсегда, и расходы зависят только от тебя.</div>
    </div>`;
  })()}`;
}

/* ==========================================================
   Шторка ввода
   ========================================================== */
let draft = null;

function openSheet(html) { $("sheetBody").innerHTML = html; $("sheet").hidden = false; }
function closeSheet() { $("sheet").hidden = true; draft = null; }

function newDraft(kind, preset) {
  const firstAcc = S.accounts[0] || {};
  const d = {
    id: null, kind: kind || "expense", date: todayStr(), buf: "",
    acc: firstAcc.id, acc2: (S.accounts[1] || firstAcc).id,
    cat: (S.cats.find(c => c.kind === (kind === "income" ? "income" : "expense")) || {}).id,
    goal: (S.goals.find(g => !g.done) || {}).id, note: ""
  };
  return Object.assign(d, preset || {});
}
function draftFromTx(t) {
  return { id: t.id, kind: t.kind, date: t.date, buf: String(t.amount).replace(".", ","), acc: t.acc, acc2: t.acc2, cat: t.cat, goal: t.goal, note: t.note || "" };
}
const draftCur = () => (acc(draft.acc) || {}).cur || BASE;
const draftVal = () => { const v = parseFloat(String(draft.buf).replace(",", ".")); return isNaN(v) ? 0 : v; };

function sheetEntry() {
  const c = draftCur();
  const shown = draft.buf === "" ? "0" : draft.buf;
  /* Порядок ручной (поле sort). При первом запуске новой версии migrate()
     раскладывает его по частоте использования, дальше решает пользователь:
     явно выставленный порядок важнее угаданного. */
  const catList = catListOf(draft.kind === "income" ? "income" : "expense");
  const KINDS = [["expense", "Расход"], ["income", "Доход"], ["transfer", "Перевод"], ["goal", "В цель"]];

  openSheet(`
    <div class="grab"></div>
    <div class="seg" id="kseg">${KINDS.map(k => `<button data-k="${k[0]}" data-act="kind" class="${draft.kind === k[0] ? "on" : ""}">${k[1]}</button>`).join("")}</div>

    <div class="amount">
      <div class="v ${draft.kind === "income" ? "tq" : draft.kind === "goal" ? "sf" : draft.kind === "transfer" ? "lz" : ""}">${esc(shown)}<span style="font-size:20px;color:var(--dim)"> ${curInfo(c).sym}</span></div>
      <div class="c">${c !== BASE ? "по курсу " + nf0.format(rateOf(c)) + " = " + fmtShort(draftVal() * rateOf(c)) + " сум" : "&nbsp;"}</div>
    </div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="key" data-k="${n}">${n}</button>`).join("")}
      <button class="alt" data-act="key" data-k="${curInfo(c).dec === 2 ? "," : "000"}">${curInfo(c).dec === 2 ? "," : "000"}</button>
      <button data-act="key" data-k="0">0</button>
      <button class="alt" data-act="key" data-k="del">⌫</button>
    </div>

    ${draft.kind === "transfer" ? `
      <label class="f">Откуда</label>
      <select class="inp" data-set-d="acc">${accList().map(a => `<option value="${a.id}" ${a.id === draft.acc ? "selected" : ""}>${esc(a.name)} (${a.cur})</option>`).join("")}</select>
      <label class="f">Куда</label>
      <select class="inp" data-set-d="acc2">${accList().map(a => `<option value="${a.id}" ${a.id === draft.acc2 ? "selected" : ""}>${esc(a.name)} (${a.cur})</option>`).join("")}</select>
      ${(acc(draft.acc) || {}).cur !== (acc(draft.acc2) || {}).cur ? `
        <label class="f">Сколько зачислено (${(acc(draft.acc2) || {}).cur})</label>
        <input class="inp" type="number" inputmode="decimal" data-set-d="amount2" value="${draft.amount2 != null ? draft.amount2 : ""}" placeholder="по курсу автоматически">` : ""}
    ` : draft.kind === "goal" ? `
      <label class="f">Цель</label>
      <select class="inp" data-set-d="goal">${S.goals.filter(g => !g.done).map(g => `<option value="${g.id}" ${g.id === draft.goal ? "selected" : ""}>${esc(g.name)}</option>`).join("") || `<option value="">Сначала создай цель</option>`}</select>
      <label class="f">Со счёта</label>
      <select class="inp" data-set-d="acc">${accList().map(a => `<option value="${a.id}" ${a.id === draft.acc ? "selected" : ""}>${esc(a.name)} (${a.cur})</option>`).join("")}</select>
    ` : `
      <label class="f">Категория</label>
      <div class="chips">${catList.map(x => `<button class="chip ${x.id === draft.cat ? "on" : ""}" data-act="cat" data-id="${x.id}">${x.icon} ${esc(x.name)}</button>`).join("")}</div>
      <label class="f">Счёт</label>
      <div class="chips">${accList().map(a => `<button class="chip sm ${a.id === draft.acc ? "on" : ""}" data-act="acc" data-id="${a.id}">${a.icon} ${esc(a.name)}</button>`).join("")}</div>
    `}

    <label class="f">Дата</label>
    <div class="row">
      <button class="chip sm ${draft.date === todayStr() ? "on" : ""}" data-act="date-today">Сегодня</button>
      <button class="chip sm ${draft.date === shiftDay(todayStr(), -1) ? "on" : ""}" data-act="date-yest">Вчера</button>
      <input class="inp" type="date" style="flex:1" data-set-d="date" value="${draft.date}">
    </div>

    <label class="f">Комментарий</label>
    <input class="inp" data-set-d="note" value="${esc(draft.note)}" placeholder="необязательно">

    ${draft.id ? `<div style="height:14px"></div>
      <button class="btn danger sm" data-act="del-tx">Удалить операцию</button>` : ""}

    <div class="sheet-actions">
      <button class="btn ghost" data-act="close">Отмена</button>
      <button class="btn" data-act="save-tx">${draft.id ? "Сохранить" : "Записать"}</button>
    </div>
  `);
}
function shiftDay(d, k) { const x = new Date(d); x.setDate(x.getDate() + k); return x.getFullYear() + "-" + pad2(x.getMonth() + 1) + "-" + pad2(x.getDate()); }

function saveTx() {
  const v = draftVal();
  if (v <= 0) return toast("Введи сумму");
  if (draft.kind === "goal" && !draft.goal) return toast("Сначала создай цель");
  if (draft.kind === "transfer" && draft.acc === draft.acc2) return toast("Счета должны отличаться");
  const c = draftCur();
  const t = {
    id: draft.id || uid(), kind: draft.kind, date: draft.date, amount: v, cur: c, rate: rateOf(c),
    acc: draft.acc, note: (draft.note || "").trim(), updatedAt: Date.now(), dirty: 1
  };
  if (draft.kind === "transfer") {
    t.acc2 = draft.acc2;
    const c2 = (acc(draft.acc2) || {}).cur;
    /* Кросс-курс через базу: сумма в валюте «откуда» → сум → валюта «куда».
       Прежняя формула умела только пару сум/доллар. */
    if (c2 !== c) t.amount2 = draft.amount2 != null && draft.amount2 !== ""
      ? +draft.amount2
      : v * rateOf(c) / rateOf(c2);
    else t.amount2 = v;
  } else if (draft.kind === "goal") t.goal = draft.goal;
  else t.cat = draft.cat;

  const isEdit = !!draft.id;
  if (isEdit) { const i = S.tx.findIndex(x => x.id === draft.id); if (i >= 0) S.tx[i] = t; }
  else S.tx.push(t);
  closeSheet();
  S.ui.month = ym(t.date);
  save(); render();
  toast(isEdit ? "Изменения сохранены" : "Записано");
}

/** Карточка уже записанной сверки: посмотреть и отменить */
function sheetAdjust(t) {
  const a = acc(t.acc);
  openSheet(`<div class="grab"></div>
    <div class="eyebrow">Сверка остатка</div>
    <div class="amount"><div class="v ${t.amount < 0 ? "pm" : "tq"}">${t.amount < 0 ? "−" : "+"}${nf0.format(Math.abs(Math.round(t.amount)))}<span style="font-size:20px;color:var(--dim)"> ${curInfo(t.cur).sym}</span></div>
      <div class="c">${fmtDate(t.date)} · ${esc(a ? a.name : "счёт удалён")}</div></div>
    ${t.note ? `<div class="hint" style="text-align:center">${esc(t.note)}</div>` : ""}
    <div class="hint">Эта операция только поправила остаток счёта. В доходах, расходах
      и бюджете месяца её нет. Если разница была записана по ошибке — отмени её,
      остаток вернётся к расчётному.</div>
    <div class="sheet-actions">
      <button class="btn ghost" data-act="close">Закрыть</button>
      <button class="btn danger" data-act="del-tx" data-id="${t.id}">Отменить сверку</button>
    </div>`);
}

/**
 * Сверка остатка. Разница между фактом и расчётом пишется отдельной
 * операцией, а не правкой начального остатка: в журнале видно, когда
 * и на сколько разошлось, правку можно отменить, и статистика месяца
 * при этом не искажается.
 */
function sheetReconcile(accId) {
  const a = acc(accId); if (!a) return;
  const calc = balances()[a.id] || 0;
  openSheet(`<div class="grab"></div>
    <div class="eyebrow">Сверка остатка</div>
    <div class="row" style="margin:4px 0 12px"><div class="ic">${a.icon || "•"}</div>
      <div class="t"><b style="font-size:16px">${esc(a.name)}</b>
        <span class="dim" style="font-size:12.5px">по расчёту ${fmt(calc, a.cur)}</span></div></div>
    <label class="f">Сколько на самом деле</label>
    <input class="inp num" id="rc_val" type="number" inputmode="decimal" step="any"
           value="${a.cur === "USD" ? calc.toFixed(2) : Math.round(calc)}" data-rc="${a.id}">
    <div class="echo num" id="rc_diff">разница 0</div>
    <label class="f">Комментарий</label>
    <input class="inp" id="rc_note" placeholder="забыл записать приход, потерял чек…">
    <div class="hint">Разница ляжет отдельной операцией «Сверка остатка» на сегодня.
      В доходы, расходы и бюджет месяца она не попадёт — только поправит остаток счёта.</div>
    <div class="sheet-actions">
      <button class="btn ghost" data-act="close">Отмена</button>

    </div>`);
  setTimeout(() => { const i = $("rc_val"); if (i) { i.focus(); i.select(); } }, 60);
}

/* ==========================================================
   Экспорт / импорт
   ========================================================== */
function download(name, text, type) {
  const b = new Blob([text], { type: type || "application/json;charset=utf-8" });
  const u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 500);
}
function exportCsv() {
  const head = ["Дата", "Тип", "Категория", "Счёт", "Счёт 2", "Сумма", "Валюта", "Курс", "Сумма в сумах", "Комментарий"];
  const KIND = { expense: "Расход", income: "Доход", transfer: "Перевод", goal: "В цель" };
  const rows = S.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).map(t => [
    t.date, KIND[t.kind] || t.kind,
    t.kind === "goal" ? ((goal(t.goal) || {}).name || "") : ((cat(t.cat) || {}).name || ""),
    (acc(t.acc) || {}).name || "", (acc(t.acc2) || {}).name || "",
    String(t.amount).replace(".", ","), t.cur, t.rate || "",
    String(Math.round(toBase(t))), t.note || ""
  ]);
  const csv = "\uFEFF" + [head, ...rows].map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  download("finance_" + todayStr() + ".csv", csv, "text/csv;charset=utf-8");
}

/* ==========================================================
   События
   ========================================================== */
let toastTimer = null;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1700);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;

  switch (a) {
    case "tab": S.ui.tab = el.dataset.tab; save(); render(); break;
    case "settings": S.ui.tab = "settings"; render(); break;
    case "mprev": S.ui.month = shiftMonth(S.ui.month, -1); render(); break;
    case "mnext": S.ui.month = shiftMonth(S.ui.month, 1); render(); break;
    case "close": closeSheet(); break;

    case "add": draft = newDraft(el.dataset.kind, el.dataset.goal ? { goal: el.dataset.goal } : null); sheetEntry(); break;
    case "edit": {
      const t = S.tx.find(x => x.id === id); if (!t) break;
      /* Сверку остатка редактировать нечего: сумма в ней — следствие
         расхождения, а не введённая величина. Её либо отменяют,
         либо делают новую сверку. */
      if (t.kind === "adjust") { sheetAdjust(t); break; }
      draft = draftFromTx(t); sheetEntry(); break;
    }
    case "kind": draft.kind = el.dataset.k;
      if (draft.kind !== "transfer" && draft.kind !== "goal") {
        const c = cat(draft.cat);
        if (!c || c.kind !== (draft.kind === "income" ? "income" : "expense"))
          draft.cat = (S.cats.find(x => x.kind === (draft.kind === "income" ? "income" : "expense")) || {}).id;
      }
      sheetEntry(); break;
    case "key": {
      const k = el.dataset.k;
      if (k === "del") draft.buf = draft.buf.slice(0, -1);
      else if (k === ",") { if (draft.buf.indexOf(",") < 0) draft.buf = (draft.buf || "0") + ","; }
      else if (draft.buf.indexOf(",") >= 0) { if (draft.buf.split(",")[1].length < 2) draft.buf += k; }
      else if (draft.buf.replace(/\D/g, "").length < 12) draft.buf = (draft.buf === "0" ? "" : draft.buf) + k;
      sheetEntry(); break;
    }
    case "cat": draft.cat = id; sheetEntry(); break;
    case "acc": draft.acc = id; sheetEntry(); break;
    case "date-today": draft.date = todayStr(); sheetEntry(); break;
    case "date-yest": draft.date = shiftDay(todayStr(), -1); sheetEntry(); break;
    case "save-tx": saveTx(); break;
    case "del-tx": {
      /* Кнопка приходит и из шторки ввода (там есть draft), и из карточки
         сверки (там draft пустой, id стоит на самой кнопке) */
      const tid = id || (draft && draft.id);
      if (!tid) break;
      bury("tx", tid); S.tx = S.tx.filter(x => x.id !== tid);
      save(); closeSheet(); render(); toast("Удалено"); break;
    }

    case "goal-new": sheetGoal(null); break;
    case "goal-edit": sheetGoal(id); break;
    case "goal-save": {
      const g = {
        id: id || uid(),
        name: ($("g_name").value || "Цель").trim(),
        target: +$("g_target").value || 0,
        cur: $("g_cur").value,
        initial: +$("g_init").value || 0,
        deadline: $("g_dl").value || "",
        done: $("g_done").checked,
        updatedAt: Date.now(), dirty: 1
      };
      const i = S.goals.findIndex(x => x.id === g.id);
      if (i >= 0) S.goals[i] = g; else S.goals.push(g);
      save(); closeSheet(); render(); toast("Цель сохранена"); break;
    }
    case "goal-done": {
      const g = goal(id); if (!g) break;
      g.done = true; touch(g); save(); render();
      toast("Цель закрыта");
      break;
    }
    case "goal-return": {
      const g = goal(id); if (!g) break;
      const net = goalNet(id);
      if (net <= 0) { toast("Возвращать нечего"); break; }
      const accId = $("g_back_acc") ? $("g_back_acc").value : "";
      const a = acc(accId);
      if (!a) { toast("Выбери счёт"); break; }
      /* Возврат — тот же взнос с обратным знаком: балансы, копилка и прогресс
         пересчитываются сами, история при этом сохраняется целиком */
      S.tx.push({
        id: uid(), kind: "goal", date: todayStr(), cur: a.cur, rate: rateOf(a.cur),
        amount: -(net / rateOf(a.cur)),
        acc: accId, goal: id, note: "возврат из цели", updatedAt: Date.now(), dirty: 1
      });
      save(); closeSheet(); render(); toast("Возвращено " + fmtShort(net)); break;
    }
    case "goal-del": {
      const net = goalNet(id);
      if (net > 0) { toast("Сначала верни " + fmtShort(net) + " на счёт"); break; }
      bury("goal", id); S.goals = S.goals.filter(g => g.id !== id); save(); closeSheet(); render(); break;
    }

    case "acc-up": case "acc-down":
      if (moveInGroup(S.accounts, id, a === "acc-up" ? -1 : 1)) { save(); render(); }
      break;
    case "cat-up": case "cat-down": {
      const c = cat(id); if (!c) break;
      /* Двигаем внутри своего вида: расходные и доходные категории —
         две независимые группы, у каждой своя нумерация sort */
      if (moveInGroup(S.cats.filter(x => x.kind === c.kind), id, a === "cat-up" ? -1 : 1)) { save(); render(); }
      break;
    }
    case "acc-reconcile": sheetReconcile(id); break;
    case "rc-save": {
      const a = acc(id); if (!a) break;
      const el2 = $("rc_val");
      if (!el2 || el2.value === "") { toast("Введи фактический остаток"); break; }
      const calc = balances()[a.id] || 0;
      const fact = +el2.value;
      if (!isFinite(fact)) { toast("Не похоже на сумму"); break; }
      /* Округление до копейки/сума: иначе разница 0,0000001 создаёт
         операцию-пустышку на каждой сверке */
      const step = a.cur === "USD" ? 100 : 1;
      const diff = Math.round((fact - calc) * step) / step;
      if (diff === 0) { toast("Расхождений нет"); closeSheet(); break; }
      const note = ($("rc_note") && $("rc_note").value || "").trim();
      S.tx.push({
        id: uid(), kind: "adjust", date: todayStr(), amount: diff,
        cur: a.cur, rate: rateOf(a.cur), acc: a.id,
        note: note || "сверка остатка", updatedAt: Date.now(), dirty: 1
      });
      save(); closeSheet(); render();
      toast(diff > 0 ? "Добавлено " + fmt(diff, a.cur) : "Списано " + fmt(-diff, a.cur));
      break;
    }
    case "acc-new": sheetAcc(null); break;
    case "acc-edit": sheetAcc(id); break;
    case "acc-save": {
      const prev = id ? acc(id) : null;
      const o = { id: id || uid(), name: ($("a_name").value || "Счёт").trim(), icon: $("a_icon").value || "•", cur: $("a_cur").value, opening: +$("a_open").value || 0,
        /* sort переносим из прежней записи: объект собирается заново,
           и без этой строки правка названия сбрасывала порядок в конец */
        sort: prev && +prev.sort >= 0 ? +prev.sort : S.accounts.length,
        updatedAt: Date.now(), dirty: 1 };
      const i = S.accounts.findIndex(x => x.id === o.id);
      if (i >= 0) S.accounts[i] = o; else S.accounts.push(o);
      save(); closeSheet(); render(); break;
    }
    case "acc-del":
      if (S.tx.some(t => t.acc === id || t.acc2 === id)) { toast("По счёту есть операции") ; break; }
      bury("account", id); S.accounts = S.accounts.filter(x => x.id !== id); save(); closeSheet(); render(); break;

    case "cat-new": sheetCat(null, el.dataset.kind); break;
    case "cat-edit": sheetCat(id); break;
    case "cat-save": {
      const kind = el.dataset.kind;
      const o = {
        id: id || uid(), name: ($("c_name").value || "Категория").trim(), icon: $("c_icon").value || "•", kind,
        budget: kind === "expense" ? (+$("c_bud").value || 0) : 0,
        fixed: kind === "expense" ? $("c_fix").checked : false,
        sort: (() => { const pv = id ? cat(id) : null; return pv && +pv.sort >= 0 ? +pv.sort : S.cats.length; })(),
        updatedAt: Date.now(), dirty: 1
      };
      const i = S.cats.findIndex(x => x.id === o.id);
      if (i >= 0) S.cats[i] = o; else S.cats.push(o);
      save(); closeSheet(); render(); break;
    }
    case "cat-del":
      if (S.tx.some(t => t.cat === id)) { toast("По категории есть операции"); break; }
      bury("cat", id); S.cats = S.cats.filter(x => x.id !== id); save(); closeSheet(); render(); break;

    case "sync-now":
      toast("Синхронизация…");
      SYNC.run({ manual: true }).then(r => {
        render();
        toast(!r.ok ? (r.skipped ? r.msg : "Не вышло: " + r.msg)
          : (r.got || r.sent) ? `Получено ${r.got}, отправлено ${r.sent}` : "Всё уже совпадает");
      });
      break;
    case "export-json":
      S.settings.lastBackup = new Date().toISOString();
      S.settings.updatedAt = Date.now(); S.settings.dirty = 1;
      download("finance_backup_" + todayStr() + ".json", JSON.stringify(S, null, 2));
      save(); render(); toast("Бэкап скачан"); break;
    case "export-csv": exportCsv(); toast("CSV скачан"); break;
    case "wipe":
      if (confirm("Стереть все счета, категории, операции и цели? Действие необратимо.")) {
        S = defaults(); store.save(S); render(); toast("Данные стёрты");
      } break;
  }
});

/* Поля настроек и полей шторки */
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.setS) {
    S.sync[el.dataset.setS] = (el.value || "").trim();
    S.sync.status = ""; S.sync.err = ""; S.sync.fails = 0; save(); render();
    return;
  }
  if (el.dataset.setChk) {
    S.settings[el.dataset.setChk] = !!el.checked;
    S.settings.updatedAt = Date.now(); S.settings.dirty = 1;
    save(); render();
    if (el.dataset.setChk === "autoRates" && el.checked) {
      toast("Курс придёт при следующем обмене");
      SYNC.run().then(r => { if (r.ok) safeRender(); });
    }
    return;
  }
  if (el.dataset.setRate) {
    const c = el.dataset.setRate, v = +el.value;
    S.settings.rates = S.settings.rates || {};
    S.settings.rates[c] = v > 0 ? v : 1;
    /* Плоское поле оставляем в синхронизации для старых версий приложения */
    if (c === "USD") S.settings.rate = S.settings.rates.USD;
    S.settings.updatedAt = Date.now(); S.settings.dirty = 1;
    save();
    toast("Курс " + CUR[c].gen + " обновлён");
    return;
  }
  if (el.dataset.set) {
    S.settings[el.dataset.set] = +el.value || 0;
    S.settings.updatedAt = Date.now(); S.settings.dirty = 1;
    save();
    return;
  }
  if (el.dataset.setD && draft) {
    const k = el.dataset.setD;
    draft[k] = k === "amount2" ? (el.value === "" ? null : +el.value) : el.value;
    if (k === "acc" || k === "acc2") sheetEntry();
    return;
  }
  if (el.id === "importFile" && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const o = JSON.parse(String(fr.result));
        if (!o || !Array.isArray(o.tx) || !Array.isArray(o.accounts)) throw new Error("bad");
        S = Object.assign(defaults(), o);
        S.ui = S.ui || { tab: "home", month: ym(todayStr()) };
        S.ui.tab = "home";
        /* Восстановленное считаем неотправленным и тянем заново: бэкап мог быть снят
           до подключения синхронизации либо разойтись с таблицей */
        S.sync.lastSync = 0;
        migrate();
        store.save(S); render(); toast("Данные восстановлены");
      } catch (err) { toast("Файл не читается"); }
    };
    fr.readAsText(el.files[0]);
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.setD && draft && e.target.dataset.setD === "note") draft.note = e.target.value;
  /* Эхо считаем прямо при вводе: перерисовка экрана съела бы фокус и каретку */
  if (e.target.dataset.rc) {
    const a = acc(e.target.dataset.rc), out = $("rc_diff");
    if (a && out) {
      const d = (+e.target.value || 0) - (balances()[a.id] || 0);
      out.textContent = Math.abs(d) < 1e-9 ? "расхождений нет"
        : (d > 0 ? "не хватает в приложении " : "лишнее в приложении ") + fmt(Math.abs(d), a.cur);
      out.style.color = Math.abs(d) < 1e-9 ? "var(--tx-2)" : d > 0 ? "var(--pos)" : "var(--neg)";
    }
    return;
  }
  if (e.target.dataset.echo) {
    const echo = e.target.nextElementSibling;
    if (!echo || !echo.classList.contains("echo")) return;
    const c = e.target.dataset.setRate;
    echo.textContent = c
      ? "1" + CUR[c].sym + " = " + nf0.format(+e.target.value || 0) + " сум"
      : nf0.format(+e.target.value || 0);
  }
});
$("fab").addEventListener("click", () => { draft = newDraft("expense"); sheetEntry(); });
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ==========================================================
   Старт
   ========================================================== */
(async function init() {
  /* Офлайн-режим: только там, где Service Worker вообще доступен —
     это https и localhost. На file:// и content:// его нет. */
  try {
    if (typeof navigator !== "undefined" && navigator.serviceWorker && typeof location !== "undefined" &&
        (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  } catch (e) {}
  await store.requestPersist();
  const saved = await store.load();
  if (saved && saved.accounts) {
    S = Object.assign(defaults(), saved);
    S.settings = Object.assign(defaults().settings, saved.settings || {});
    S.ui = Object.assign({ tab: "home", month: ym(todayStr()) }, saved.ui || {});
  }
  migrate();
  render();

  /* Автосинхронизация: старт, возврат сети, возврат в приложение */
  const pulse = () => SYNC.run().then(r => { if (r.ok && (r.got || r.sent)) safeRender(); });
  if (SYNC.configured()) pulse();
  try {
    if (typeof window !== "undefined" && window.addEventListener) window.addEventListener("online", pulse);
    if (typeof document !== "undefined" && document.addEventListener)
      document.addEventListener("visibilitychange", () => { if (!document.hidden) pulse(); });
  } catch (e) {}
})();

/** Данные из старых версий: без меток изменения слияние работать не может */
function migrate() {
  const now = Date.now();
  S.trash = S.trash || {};
  /* старый формат надгробия — просто число */
  Object.keys(S.trash).forEach(k => { if (typeof S.trash[k] === "number") S.trash[k] = { t: S.trash[k], d: 1 }; });
  S.sync = Object.assign({ url: "", token: "", lastSync: 0, at: 0, status: "", err: "", fails: 0 }, S.sync || {});
  const neverSynced = !Number(S.sync.lastSync);
  [S.tx, S.accounts, S.cats, S.goals].forEach(arr => (arr || []).forEach(r => {
    if (!r.updatedAt) r.updatedAt = now;
    if (neverSynced) r.dirty = 1;   // ничего ещё не уезжало — отдать всё
  }));
  /* Порядок списков. У записей из прежних версий поля sort нет.
     Счета получают номера по текущему порядку массива, категории —
     по частоте использования: так список в шторке ввода открывается
     сразу удобным, а дальше порядок правится руками и больше
     не пересчитывается. */
  if (!S.accounts.every(a => +a.sort >= 0)) {
    S.accounts.forEach((a, i) => { if (!(+a.sort >= 0)) { a.sort = i; touch(a); } });
  }
  ["expense", "income"].forEach(kind => {
    const grp = S.cats.filter(c => c.kind === kind);
    if (grp.every(c => +c.sort >= 0)) return;
    const use = {};
    S.tx.forEach(t => { if (t.cat) use[t.cat] = (use[t.cat] || 0) + 1; });
    grp.map((c, i) => ({ c, i }))
      .sort((x, y) => (use[y.c.id] || 0) - (use[x.c.id] || 0) || x.i - y.i)
      .forEach((o, k) => { if (+o.c.sort !== k) { o.c.sort = k; touch(o.c); } });
  });

  /* Поля, добавленные позже старта: у ранних пользователей их нет,
     и в настройках рисуется value="undefined" */
  /* Курс доллара раньше лежал плоским полем settings.rate; теперь курсы
     живут в карте rates.
     ВАЖНО про версию схемы: настройки грузятся как
     Object.assign(defaults().settings, saved.settings), то есть шалловым
     слиянием. Вложенный объект rates из defaults() при этом ЦЕЛИКОМ
     побеждает — у пользователя с версией без rates дефолтные 12800 молча
     затирали его настоящие 11800, а потом уезжали в таблицу. Отличить
     «rates ещё не было» от «rates уже настроен» можно только по номеру
     схемы, поэтому он здесь и появился. Любое следующее вложенное поле
     в settings обязано мигрироваться через sv, а не через проверку
     «пустое ли оно». */
  if (!S.settings.rates || typeof S.settings.rates !== "object") S.settings.rates = {};
  if (!(+S.settings.sv >= 2)) {
    /* У свежей установки плоского rate нет вовсе — тогда остаётся дефолт */
    if (+S.settings.rate > 0) S.settings.rates.USD = +S.settings.rate;
    S.settings.sv = 2;
  }
  const def = defaults().settings;
  Object.keys(def).forEach(k => { if (S.settings[k] === undefined) S.settings[k] = def[k]; });
  CURS.forEach(c => { if (c !== BASE && !(+S.settings.rates[c] > 0)) S.settings.rates[c] = def.rates[c] || 1; });
  /* Плоское поле держим в синхронизации: старые версии на других
     устройствах читают курс доллара только из него. */
  S.settings.rate = +S.settings.rates.USD || 1;
  if (!S.settings.updatedAt) S.settings.updatedAt = now;
  if (neverSynced) S.settings.dirty = 1;
}
</script>
