<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E1B3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Финансы">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<link rel="preload" href="fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/mono-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ================== Шрифты ==================
   Свои копии вместо Google Fonts: sw.js не кэширует чужие домены,
   поэтому через CDN шрифты не работали офлайн. Все три — OFL-1.1,
   переменные, вес задаётся диапазоном. Файлы лежат в ./fonts/. */
@font-face{
  font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('fonts/inter-latin.woff2') format('woff2-variations');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('fonts/inter-cyrillic.woff2') format('woff2-variations');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
}
@font-face{
  font-family:'Unbounded';font-style:normal;font-weight:200 900;font-display:swap;
  src:url('fonts/unbounded-latin.woff2') format('woff2-variations');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Unbounded';font-style:normal;font-weight:200 900;font-display:swap;
  src:url('fonts/unbounded-cyrillic.woff2') format('woff2-variations');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
}
@font-face{
  font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:swap;
  src:url('fonts/mono-latin.woff2') format('woff2-variations');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:swap;
  src:url('fonts/mono-cyrillic.woff2') format('woff2-variations');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
}

/* ================== Токены ================== */
/* палитра — из дизайн-системы "Ponaehali Report Palette" */
:root{
  /* --- поверхности --- */
  --ground:#0E1B3D;      /* ink   — фон экрана */
  --surface:#152357;     /* navy 700 — карточка */
  --surface-2:#23316B;   /* navy 600 — поднятая поверхность */
  --line:rgba(242,233,216,.10);

  /* --- чернила --- */
  --tx-1:#F2E9D8;        /* cream    — основной текст, 14.0:1 к фону */
  --tx-2:#B9BCCC;        /* вторичный текст */
  --tx-3:#9BA0B4;        /* приглушённый: 5,73:1 на surface, 4,69 на surface-2 */

  /* --- статусы: светлые шаги, проходят AA как текст на тёмном --- */
  --pos:#6FB088;         /* доход, норма      6.6:1 */
  --neg:#EE6F70;         /* расход, перерасход 5.8:1 */
  --warn:#DCC38C;        /* цели, внимание    9.8:1 */
  --info:#769FCF;        /* переводы */
  /* --- базовые: только заливки, для текста контраста не хватает --- */
  --pos-fill:#3A8C5A; --neg-fill:#E8344A; --warn-fill:#C9A24E; --info-fill:#2C6BB5;

  /* --- шкала отступов, база 4 --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;

  /* --- радиусы --- */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;

  /* --- гарнитуры, свои копии в ./fonts --- */
  --fd:'Unbounded',system-ui,sans-serif;                          /* заголовки */
  --fn:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;    /* цифры */
  --fb:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; /* интерфейс */

  /* --- псевдонимы старых имён: снять после рефакторинга разметки --- */
  --ink:var(--ground); --ink2:var(--surface); --ink3:var(--surface-2);
  --text:var(--tx-1);  --dim:var(--tx-3);
  --turq:var(--pos-fill); --turq2:var(--pos);
  --saffron:var(--warn-fill); --pom:var(--neg-fill); --lapis:var(--info-fill);
  --r:var(--r-lg); --pad:var(--s4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.4}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--turq2);outline-offset:2px}
/* Без :active нажатие цифры не давало никакого отклика, а результат ввода
   при этом уезжал за экран — набирали вслепую. */
.pad button:active,.chip:active,.seg button:active,.tabs button:active,
.btn:active,.icon-btn:active,#fab:active,.badge[data-act]:active{transform:scale(.97);opacity:.75}
.li[data-act]:active{background:var(--ink3)}

#app{max-width:520px;margin:0 auto;padding:0 var(--s4)}

/* ================== Шапка ================== */
/* Градиент в прозрачность оставлял нижнюю четверть шапки насквозь видимой:
   карточки при скролле наезжали прямо на подзаголовок. Матовая подложка
   как у нижней панели — тот же приём, та же плотность. */
.top{display:flex;align-items:center;gap:10px;padding:16px 2px 10px;position:sticky;top:0;
  background:var(--ink);box-shadow:0 10px 14px -10px var(--ink);z-index:20}
.top h1{font-family:var(--fd);font-size:21px;font-weight:700;margin:0;letter-spacing:.2px;flex:1}
.top .sub{font-size:12px;color:var(--dim);font-weight:400;font-family:var(--fb)}
.icon-btn{width:44px;height:44px;border-radius:var(--r-md);background:var(--ink2);display:grid;place-items:center;font-size:17px;border:1px solid var(--line)}

/* ================== Карточки ================== */
.card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:10px}
.card.tight{padding:10px 12px}
.eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0 0 8px}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.big{font-size:34px;font-weight:700;line-height:1.05}
.mid{font-size:20px;font-weight:700}
.dim{color:var(--dim)}
/* Текст берёт светлые шаги: заливочные (--*-fill) на карточке дают 2,75–3,6:1. */
.tq{color:var(--pos)}.sf{color:var(--warn)}.pm{color:var(--neg)}.lz{color:var(--info)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
/* В плитке 1/3 ширины «−11,4 млн» одной строкой не помещается ни при каком
   кегле. Единица уходит вниз намеренно и оформленно — это не перенос. */
.unit{display:block;font-size:11px;line-height:1.2;font-weight:400;color:var(--tx-3);letter-spacing:.06em;margin-top:2px;font-family:var(--fb)}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}

/* ================== Полосы ================== */
/* Штриховка закреплена за перебором и больше ни за чем: пока ею была залита
   любая полоса, она ничего не сообщала. Теперь это второй признак поверх
   цвета — читается и без различения красного и зелёного. */
.bar{position:relative;height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--turq)}
.bar.warn>i{background:var(--saffron)}
.bar.gold>i{background:var(--saffron)}
.bar.over>i{background:repeating-linear-gradient(115deg,var(--pom) 0 5px,#F39A8E 5px 9px)}
/* Засечка лимита: видно, насколько полоса перевалила за бюджет */
.bar>u{position:absolute;top:0;bottom:0;width:2px;background:var(--tx-1);opacity:.7;border-radius:1px}

/* ================== Пульс месяца (сигнатура) ================== */
.pulse{width:100%;height:78px;display:block}
.pulse rect.d{transform-box:fill-box;transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pulse-legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:4px}

/* ================== Списки ================== */
.li{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:11px;background:var(--ink3);display:grid;place-items:center;font-size:17px;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:12px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-family:var(--fn);font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
.daybar{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:12px 0 4px;letter-spacing:.02em}

/* ================== Чипы / сегменты ================== */
.seg{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:var(--s3) var(--s1);min-height:44px;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--ink3);color:var(--text)}
.seg button.on[data-k="expense"]{background:rgba(232,52,74,.22);color:#EE6F70}
.seg button.on[data-k="income"]{background:rgba(58,140,90,.2);color:var(--turq2)}
.seg button.on[data-k="transfer"]{background:rgba(44,107,181,.2);color:#769FCF}
.seg button.on[data-k="goal"]{background:rgba(201,162,78,.2);color:#DCC38C}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:var(--s2) var(--s3);min-height:40px;border-radius:var(--r-md);background:var(--ink3);border:1px solid transparent;font-size:13px;display:flex;gap:6px;align-items:center}
.chip.on{border-color:var(--pos);background:rgba(58,140,90,.16)}
.chip.sm{padding:6px 10px;font-size:12.5px}

/* ================== Поля ================== */
label.f{display:block;margin:12px 0 6px;font-size:11.5px;color:var(--dim);letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.inp{width:100%;padding:11px 12px;border-radius:12px;background:var(--ink);border:1px solid var(--line);color:var(--text)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.btn{display:block;width:100%;padding:14px;border-radius:13px;background:var(--turq);color:var(--text);font-weight:700;font-size:15px;text-align:center}
.btn.ghost{background:var(--ink3);color:var(--text)}
.btn.danger{background:rgba(232,52,74,.16);color:#EE6F70}
.btn.sm{padding:9px;font-size:13.5px}

/* ================== Навигация ================== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:rgba(14,27,61,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabs .in{display:flex;width:100%;max-width:520px;gap:4px;align-items:stretch}
.tabs .tt{display:flex;flex:1;min-width:0}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:var(--s1) 2px;min-height:48px;color:var(--dim);font-size:11px;font-weight:600}
.tabs button em{font-style:normal;font-size:18px;line-height:1}
.tabs button.on{color:var(--turq2)}
/* «+» стоит в самой панели, а не поверх экрана: плавающая кнопка накрывала
   суммы и целые строки операций — на «Журнале» строка становилась ненажимаемой. */
#fab{flex:none;width:56px;min-height:48px;border-radius:var(--r-md);background:var(--saffron);
  color:var(--ink);font-size:26px;font-weight:700;display:grid;place-items:center;line-height:1}

/* ================== Шторка ================== */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(5,9,20,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .card2{width:100%;max-width:520px;max-height:94vh;overflow:auto;background:var(--ink2);
  border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px}
/* Кнопка записи стояла в конце длинного списка категорий и уходила
   ниже сгиба: содержимое 1162 px при видимой части 792. Панель липнет
   к низу шторки — записать можно с любого места. */
.sheet-actions{position:sticky;bottom:0;z-index:3;display:grid;grid-template-columns:1fr 1.4fr;gap:8px;
  margin:14px -14px calc(-18px - env(safe-area-inset-bottom));
  padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:var(--ink2);box-shadow:0 -8px 10px -8px var(--ink)}
.sheet-actions .btn{margin:0}

/* ================== Клавиатура ================== */
/* Сумма липнет к верху шторки: при прокрутке к категориям она уходила
   за экран, и ввод шёл вслепую. */
.amount{position:sticky;top:-1px;z-index:3;text-align:center;padding:10px 0 8px;
  background:var(--ink2);box-shadow:0 8px 10px -8px var(--ink)}
.amount .v{font-family:var(--fn);font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.amount .c{font-size:12px;color:var(--dim);margin-top:2px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.pad button{padding:14px 0;border-radius:12px;background:var(--ink3);font-family:var(--fn);font-size:21px;font-weight:700}
.pad button.alt{background:var(--ink);color:var(--dim);font-size:17px}

/* ================== Прочее ================== */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:80;
  opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--dim);padding:26px 12px;font-size:13.5px}
.syncing{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--ink3);border:1px solid var(--line);border-radius:20px;padding:5px 13px;
  font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:7px;
  box-shadow:0 4px 14px rgba(0,0,0,.35)}
.syncing[hidden]{display:none}
.syncing i{width:7px;height:7px;border-radius:50%;background:var(--turq);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.lvl{display:flex;gap:5px;margin-top:8px}
.lvl i{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.08)}
.lvl i.on{background:var(--saffron)}
/* Текущий уровень читается и без цвета заливки — подписью */
.lvl-now{color:var(--tx-1);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dots i{width:11px;height:11px;border-radius:4px;background:rgba(255,255,255,.09)}
.dots i.on{background:var(--turq)}
.dots i.half{background:linear-gradient(90deg,var(--turq) 50%,rgba(255,255,255,.09) 50%)}
.badge{font-size:10.5px;padding:3px 7px;border-radius:7px;background:var(--ink3);color:var(--tx-2);font-weight:700}
/* Бейдж-кнопка обязан дотягивать до 24×24 — минимум WCAG 2.2 (SC 2.5.8). */
button.badge,.badge[data-act]{min-height:24px;padding:5px 9px;display:inline-flex;align-items:center;gap:4px}
button.badge[disabled]{opacity:.32;pointer-events:none}
/* Кнопки порядка: узкая пара стрелок, чтобы в строке помещались
   и «сверить», и «···». Ширина под палец — 28 px при высоте 26. */
.ord{display:flex;flex-direction:column;gap:2px;flex:none}
.ord .badge{min-height:26px;width:28px;padding:0;justify-content:center;font-size:13px;line-height:1}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
/* Эхо под полем: «18000000» без разделителей глазом не проверить */
.echo{font-size:12px;color:var(--tx-2);margin-top:5px;letter-spacing:.02em;min-height:1em}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--pos-fill);flex:none}
.inp[disabled]{opacity:.55}
/* Три колонки вместо одной строки: «1,6 млн в мес · 19,2 млн в год»
   на 390 px рвалось так, что «в год» оставалось сиротой на второй строке. */
.fx-head,.fx-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline}
.fx-head{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);padding:2px 0 4px}
.fx-head span+span,.fx-row span+span{text-align:right;min-width:62px}
.fx-row{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.fx-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-row .num{font-size:12.5px;font-weight:700;white-space:nowrap}
.fx-row .num.dim{font-weight:400}
.card.alarm{border-color:rgba(232,52,74,.55);background:linear-gradient(var(--ink2),rgba(232,52,74,.10))}
.card.warn-soft{border-color:rgba(201,162,78,.35);padding:10px 12px}
/* Единственным медиазапросом был reduced-motion: на 1369 px приложение
   рисовало колонку 520 px с полями по 425. От планшета — две колонки,
   карточки не разрезаются между ними. */
@media (min-width:900px){
  #app{max-width:900px;padding:0 var(--s6)}
  #view{columns:2;column-gap:var(--s4)}
  #view>*{break-inside:avoid;-webkit-column-break-inside:avoid}
  .top{max-width:900px;margin:0 auto}
  .tabs .in{max-width:900px}
}
@media (min-width:1280px){
  #app{max-width:1180px}
  .top,.tabs .in{max-width:1180px}

<div class="syncing" id="syncing" hidden><i></i>обмен с таблицей</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================
   Личные финансы — автономное приложение (UZS + USD)
   Хранилище: window.storage → localStorage → память
   ========================================================== */

const KEY = "pf_uz_v1";

/* ---------- Адаптер хранилища ---------- */
const store = (() => {
  let mem = null;
  const hasW = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
  let hasLS = false;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); hasLS = true; } catch (e) { hasLS = false; }
  return {
    /** "облако" | "устройство" | "только память" — последний вариант означает потерю данных при закрытии */
    mode: hasW ? "облако" : (hasLS ? "устройство" : "только память"),
    volatile: !hasW && !hasLS,
    persisted: null,      // ответ navigator.storage.persist()
    lastOk: true,         // удалась ли последняя запись
    async load() {
      if (hasW) { try { const r = await window.storage.get(KEY); if (r && r.value) return JSON.parse(r.value); } catch (e) {} }
      if (hasLS) { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {} }
      return mem;
    },
    async save(obj) {
      const s = JSON.stringify(obj);
      mem = obj;
      if (hasW) { try { await window.storage.set(KEY, s); this.lastOk = true; return true; } catch (e) {} }
      if (hasLS) { try { localStorage.setItem(KEY, s); this.lastOk = true; return true; } catch (e) {} }
      this.lastOk = !hasW && !hasLS ? false : false;
      return false;
    },
    /** Просим браузер не вычищать хранилище при нехватке места */
    async requestPersist() {
      try {
        if (typeof navigator !== "undefined" && navigator.storage && navigator.storage.persist) {
          this.persisted = await navigator.storage.persist();
          return this.persisted;
        }
      } catch (e) {}
      this.persisted = null;
      return null;
    }
  };
})();

/* ---------- Утилиты ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const ym = d => String(d).slice(0, 7);
const daysInMonth = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_SHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const monthName = m => MONTHS[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const shiftMonth = (m, k) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + k, 1); return d.getFullYear() + "-" + pad2(d.getMonth() + 1); };

const nf0 = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* Единица отделяется неразрывным пробелом: иначе «14,8 млн» в узкой плитке
   переносится и «млн» уезжает на вторую строку, ломая сетку. */
/* ==========================================================
   Валюты. Базовая — сум: в ней считаются все агрегаты, бюджеты
   и цели. Курс хранится как «сколько базовых единиц за 1 единицу
   валюты», поэтому у операции достаточно одного поля rate — оно
   так и заполнялось для доллара, схема таблицы не меняется.
   ========================================================== */
const BASE = "UZS";
const CUR = {
  UZS: { name: "Сум",    gen: "сума",    sym: "сум", dec: 0, pre: false },
  USD: { name: "Доллар", gen: "доллара", sym: "$",   dec: 2, pre: true  },
  KZT: { name: "Тенге",  gen: "тенге",   sym: "₸",   dec: 0, pre: false }
};
const CURS = Object.keys(CUR);
const curInfo = c => CUR[c] || CUR[BASE];
/** Курс валюты к базовой. Для базовой всегда 1. */
function rateOf(c) {
  if (!c || c === BASE) return 1;
  const r = +(S.settings.rates || {})[c];
  return r > 0 ? r : 1;
}
/** Селект валюты — один источник для счетов и целей */
const curOptions = sel => CURS.map(c =>
  `<option value="${c}" ${sel === c ? "selected" : ""}>${CUR[c].name} (${CUR[c].sym})</option>`).join("");

function fmt(v, cur) {
  const c = curInfo(cur);
  const num = c.dec === 2 ? nf2.format(v || 0) : nf0.format(Math.round(v || 0));
  return c.pre ? c.sym + num : num + "\u00A0" + c.sym;
}
function fmtShort(v) {
  const a = Math.abs(v || 0), sign = v < 0 ? "−" : "";
  if (a >= 1e9) return sign + dec(a / 1e9, 2) + "\u00A0млрд";
  if (a >= 1e6) return sign + dec(a / 1e6, a >= 1e8 ? 0 : 1) + "\u00A0млн";
  if (a >= 1e4) return sign + nf0.format(Math.round(a / 1e3)) + "\u00A0тыс";
  return sign + nf0.format(Math.round(a));
}
/** Дробное число по-русски: запятая, а не точка */
const dec = (v, d) => (v || 0).toFixed(d).replace(".", ",");
/** Короткая форма в нужной валюте: «38,0 млн» либо «$1 700» */
function fmtShortCur(v, cur) {
  if (!cur || cur === BASE) return fmtShort(v);
  const c = curInfo(cur), num = nf0.format(Math.round(v || 0));
  return c.pre ? c.sym + num : num + "\u00A0" + c.sym;
}
/** Дата человеческим видом: «31 дек 2026» вместо ISO */
function fmtDate(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) return String(iso || "");
  return +iso.slice(8, 10) + "\u00A0" + MONTHS_SHORT[+iso.slice(5, 7) - 1] + "\u00A0" + iso.slice(0, 4);
}
/** Крупное значение для узкой плитки: число сверху, единица отдельной строкой */
function statBig(v) {
  const parts = fmtShort(v).split("\u00A0");
  return esc(parts[0]) + (parts[1] ? `<span class="unit">${esc(parts[1])}</span>` : "");
}
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

/* ---------- Состояние по умолчанию ---------- */
function defaults() {
  const ts = Date.now();
  /* seed — запись по умолчанию: при первом обмене с непустой таблицей такие сносятся,
     иначе на каждом новом устройстве появился бы свой комплект счетов и категорий */
  let ai = 0, ci = 0, cj = 0;
  const A = (name, cur, icon, opening) => ({ id: uid(), name, cur, icon, opening: opening || 0, sort: ai++, updatedAt: ts, dirty: 1, seed: 1 });
  const C = (name, kind, icon, fixed) => ({ id: uid(), name, kind, icon, fixed: !!fixed, budget: 0,
    sort: kind === "income" ? cj++ : ci++, updatedAt: ts, dirty: 1, seed: 1 });
  return {
    v: 1,
    /* sv (версию схемы) намеренно НЕ пишем здесь: defaults() шалловым
       слиянием подмешивается к загруженным настройкам, и метка версии
       из дефолтов сделала бы миграцию невидимой сама для себя.
       Ставит её только migrate(). */
    settings: { rates: { USD: 12800, KZT: 24 }, autoRates: true, ratesAt: "", ratesSrc: "",
      incomeTarget: 0, hours: 176, safety: 6, tax: 12, updatedAt: ts, dirty: 1 },
    accounts: [
      A("Наличные", "UZS", "💵"),
      A("Карта UZS", "UZS", "💳"),
      A("Наличные USD", "USD", "💲"),
      A("Депозит USD", "USD", "🏦")
    ],
    cats: [
      C("Продукты", "expense", "🛒"),
      C("Кафе и рестораны", "expense", "🍽"),
      C("Такси и транспорт", "expense", "🚕"),
      C("Топливо", "expense", "⛽"),
      C("Аренда", "expense", "🏠", true),
      C("Коммуналка", "expense", "💡", true),
      C("Связь и интернет", "expense", "📶", true),
      C("Детский сад", "expense", "🧸", true),
      C("Здоровье", "expense", "💊"),
      C("Одежда", "expense", "👕"),
      C("Дом и быт", "expense", "🧴"),
      C("Парфюм и уход", "expense", "🧪"),
      C("Развлечения", "expense", "🎬"),
      C("Подарки", "expense", "🎁"),
      C("Образование", "expense", "📚"),
      C("Прочее", "expense", "•"),
      C("Зарплата", "income", "💼"),
      C("Премия", "income", "🏅"),
      C("Подработка", "income", "⚡"),
      C("Проценты", "income", "📈"),
      C("Возврат", "income", "↩️")
    ],
    goals: [],
    tx: [],
    trash: {},
    sync: { url: "", token: "", lastSync: 0, at: 0, status: "", err: "", fails: 0 },
    ui: { tab: "home", month: ym(todayStr()) }
  };
}

let S = defaults();

/* ---------- Сохранение ---------- */
let saveTimer = null, syncTimer = null, retryTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { store.save(S); }, 350);
  /* Фоновая отправка: не во время активной синхронизации, иначе получится петля */
  if (S.sync && S.sync.url && !SYNC.busy) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { SYNC.run().then(r => { if (r.ok && (r.got || r.sent)) safeRender(); }); }, 4000);
  }
}
/** Индикатор идущего обмена — меняем точечно, без перерисовки экрана */
function syncFlag(on) { const el = $("syncing"); if (el) el.hidden = !on; }

/**
 * Перерисовка для фоновых событий.
 * Пока курсор стоит в поле ввода, экран не трогаем: перерисовка пересоздаёт поле
 * и стирает набранное — на этом терялся наполовину введённый токен.
 */
function safeRender() {
  const a = (typeof document !== "undefined") ? document.activeElement : null;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName || "")) return false;
  render();
  return true;
}

/** Метка изменения (для слияния) и флаг «ещё не отправлено» */
const touch = o => { o.updatedAt = Date.now(); o.dirty = 1; return o; };
/** Надгробие: простое удаление синхронизацию не переживает — запись вернулась бы с другого устройства */
const bury = (type, id) => { S.trash[type + ":" + id] = { t: Date.now(), d: 1 }; };

/* ---------- Справочники ----------
   Порядок счетов и категорий задаётся вручную полем sort: в списках
   нужен тот порядок, в котором пользователь их держит в голове, а не
   порядок создания. Поле едет в синхронизации внутри JSON записи,
   схема таблицы не меняется. */
const bySort = (a, b) => (+a.sort || 0) - (+b.sort || 0);
/** Счета в пользовательском порядке */
const accList = () => S.accounts.slice().sort(bySort);
/** Категории заданного вида в пользовательском порядке */
const catListOf = kind => S.cats.filter(c => c.kind === kind).sort(bySort);
/** Сдвинуть запись на шаг вверх (-1) или вниз (+1) внутри своей группы */
function moveInGroup(arr, id, step) {
  const ord = arr.slice().sort(bySort);
  const i = ord.findIndex(x => x.id === id);
  const j = i + step;
  if (i < 0 || j < 0 || j >= ord.length) return false;
  /* Переписываем sort по всей группе: у записей из старых версий он
     может совпадать или отсутствовать, и тогда обмен двух значений
     ничего не двигает. */
  const t = ord[i]; ord[i] = ord[j]; ord[j] = t;
  ord.forEach((x, k) => { if (+x.sort !== k) { x.sort = k; touch(x); } });
  return true;
}


const acc = id => S.accounts.find(a => a.id === id);
const cat = id => S.cats.find(c => c.id === id);
const goal = id => S.goals.find(g => g.id === id);
/** Курс доллара — остался отдельной функцией: на него ссылается разметка */
const rate = () => rateOf("USD");
/** Сумма операции в базовой валюте (сум).
    Курс берём зафиксированный в операции — иначе прошлые месяцы
    пересчитывались бы по сегодняшнему курсу. */
const toBase = t => !t.cur || t.cur === BASE
  ? (t.amount || 0)
  : (t.amount || 0) * (+t.rate || rateOf(t.cur));

/* ---------- Балансы ---------- */
function balances() {
  const m = {};
  S.accounts.forEach(a => m[a.id] = +a.opening || 0);
  S.tx.forEach(t => {
    if (t.kind === "income") m[t.acc] = (m[t.acc] || 0) + t.amount;
    else if (t.kind === "expense" || t.kind === "goal") m[t.acc] = (m[t.acc] || 0) - t.amount;
    /* Корректировка — знаковая: плюс, если денег фактически больше,
       минус, если меньше. В доходы и расходы месяца не попадает:
       monthStats и catStats разбирают kind перечислением, и adjust
       туда просто не входит — бюджет и аналитика остаются чистыми. */
    else if (t.kind === "adjust") m[t.acc] = (m[t.acc] || 0) + t.amount;
    else if (t.kind === "transfer") {
      m[t.acc] = (m[t.acc] || 0) - t.amount;
      m[t.acc2] = (m[t.acc2] || 0) + (t.amount2 != null ? t.amount2 : t.amount);
    }
  });
  return m;
}
/**
 * Свободные деньги: только остатки счетов, без взносов в цели.
 * Заголовок сводки обязан показывать именно это — иначе рядом стоят
 * «всего 48 млн» и «можно тратить в день −120 тыс», и одно противоречит
 * другому. Взносы в цель со счёта списаны и обратно не тратятся.
 */
function availableBase() {
  const b = balances();
  return S.accounts.reduce((s, a) => s + (b[a.id] || 0) * rateOf(a.cur), 0);
}
/** Свободные + отложенные. Для «месяцев свободы» и «запаса прочности»:
    накопления в целях — тоже подушка, их считать надо. */
function totalBase() {
  return availableBase() + goalPot();
}

/**
 * Деньги, лежащие в незакрытых целях.
 * Взносы списываются со счёта, поэтому без этой строки они пропадали
 * из общей суммы. Начальное «уже отложено» сюда не входит: оно никогда
 * не проходило через счета и учитывается только в прогрессе цели.
 * Закрытая цель считается потраченной, её деньги из копилки уходят.
 */
function goalPot() {
  const live = {};
  S.goals.forEach(g => { if (!g.done) live[g.id] = 1; });
  return S.tx.reduce((s, t) => s + (t.kind === "goal" && live[t.goal] ? toBase(t) : 0), 0);
}

/** Чистая сумма взносов по цели: пополнения минус возвраты */
function goalNet(id) {
  return S.tx.reduce((s, t) => s + (t.kind === "goal" && t.goal === id ? toBase(t) : 0), 0);
}

/* ---------- Статистика месяца ---------- */
function monthStats(m) {
  const r = { inc: 0, exp: 0, sav: 0, fixed: 0, byCat: {}, byDay: {}, n: 0 };
  S.tx.forEach(t => {
    if (ym(t.date) !== m) return;
    const b = toBase(t);
    if (t.kind === "income") r.inc += b;
    else if (t.kind === "expense") {
      r.exp += b; r.n++;
      r.byCat[t.cat] = (r.byCat[t.cat] || 0) + b;
      r.byDay[t.date] = (r.byDay[t.date] || 0) + b;
      const c = cat(t.cat); if (c && c.fixed) r.fixed += b;
    } else if (t.kind === "goal") r.sav += b;
  });
  r.net = r.inc - r.exp - r.sav;
  return r;
}
/** Средний расход за последние n завершённых месяцев (без текущего) */
function avgExpense(n) {
  const cur = ym(todayStr());
  let sum = 0, k = 0;
  for (let i = 1; i <= n; i++) {
    const m = shiftMonth(cur, -i);
    const s = monthStats(m);
    if (s.exp > 0) { sum += s.exp; k++; }
  }
  if (!k) { const s = monthStats(cur); return s.exp; }
  return sum / k;
}
/**
 * Опора для мотивационных расчётов — завершённые месяцы.
 * Текущий месяц для этого не годится: третьего числа зарплата и аренда
 * ещё не отражены, и любая производная от них величина бессмысленна.
 */
function baseline(n) {
  const cur = ym(todayStr());
  let inc = 0, exp = 0, k = 0;
  for (let i = 1; i <= n; i++) {
    const st = monthStats(shiftMonth(cur, -i));
    /* Нужны обе стороны: месяц с зарплатой, но без единого расхода — это
       обрывок ввода, а не месяц. Иначе «расход 0» уедет во все производные. */
    if (st.inc > 0 && st.exp > 0) { inc += st.inc; exp += st.exp; k++; }
  }
  if (k) return { inc: inc / k, exp: exp / k, months: k, partial: false };
  const st = monthStats(cur);
  return { inc: st.inc, exp: st.exp, months: 0, partial: true };
}

function incomeSeries(n) {
  const cur = ym(todayStr()), out = [];
  for (let i = n - 1; i >= 0; i--) { const m = shiftMonth(cur, -i); out.push({ m, v: monthStats(m).inc }); }
  return out;
}
/** Дневной пульс месяца: медиана, дни без трат, серии */
function dayStats(m) {
  const s = monthStats(m), dm = daysInMonth(m);
  const upto = m === ym(todayStr()) ? Math.min(dm, new Date().getDate()) : dm;
  const vals = [];
  let zero = 0, streak = 0, best = 0, run = 0;
  for (let d = 1; d <= upto; d++) {
    const v = s.byDay[m + "-" + pad2(d)] || 0;
    if (v > 0) { vals.push(v); best = Math.max(best, run); run = 0; }
    else { zero++; run++; }
  }
  best = Math.max(best, run);
  for (let d = upto; d >= 1; d--) { if ((s.byDay[m + "-" + pad2(d)] || 0) > 0) break; streak++; }
  /* Две медианы. По календарю (с нулями) — «сколько уходит в случайный день месяца»,
     это опора для планирования. По активным дням — «сколько трачу, когда трачу».
     Считать только вторую нельзя: дни без трат просто исчезают из выборки. */
  const med = a => { const x = a.slice().sort((p, q) => p - q), k = x.length;
    return !k ? 0 : (k % 2 ? x[(k - 1) / 2] : (x[k / 2 - 1] + x[k / 2]) / 2); };
  const all = [];
  for (let d = 1; d <= upto; d++) all.push(s.byDay[m + "-" + pad2(d)] || 0);
  const n = vals.length, sum = vals.reduce((a, b) => a + b, 0);
  return { days: upto, active: n, zero, streak, best,
    median: med(all), medianActive: med(vals),
    mean: upto ? sum / upto : 0, meanActive: n ? sum / n : 0,
    max: n ? Math.max(...vals) : 0 };
}

/**
 * Капитал на конец дня end. Считается ретроспективно из операций,
 * снапшоты не нужны. Формула та же, что в totalBase: счета плюс копилка целей,
 * поэтому последняя точка ряда всегда совпадает с «Всего на счетах».
 */
function capitalAt(end) {
  const m = {}, live = {};
  S.accounts.forEach(a => m[a.id] = +a.opening || 0);
  S.goals.forEach(g => { if (!g.done) live[g.id] = 1; });
  let pot = 0;
  S.tx.forEach(t => {
    if (t.date > end) return;
    if (t.kind === "income") m[t.acc] = (m[t.acc] || 0) + t.amount;
    else if (t.kind === "expense") m[t.acc] = (m[t.acc] || 0) - t.amount;
    else if (t.kind === "adjust") m[t.acc] = (m[t.acc] || 0) + t.amount;
    else if (t.kind === "goal") { m[t.acc] = (m[t.acc] || 0) - t.amount; if (live[t.goal]) pot += toBase(t); }
    else if (t.kind === "transfer") {
      m[t.acc] = (m[t.acc] || 0) - t.amount;
      m[t.acc2] = (m[t.acc2] || 0) + (t.amount2 != null ? t.amount2 : t.amount);
    }
  });
  return S.accounts.reduce((s, a) => s + (m[a.id] || 0) * rateOf(a.cur), 0) + pot;
}

/** Расходы месяца по категориям: сумма, число операций, средний чек, медиана */
function catStats(m) {
  const by = {};
  S.tx.forEach(t => {
    if (t.kind !== "expense" || ym(t.date) !== m) return;
    (by[t.cat] = by[t.cat] || []).push(toBase(t));
  });
  return Object.keys(by).map(id => {
    const v = by[id].slice().sort((a, b) => a - b), n = v.length;
    return { id, c: cat(id), sum: v.reduce((a, b) => a + b, 0), n,
      avg: v.reduce((a, b) => a + b, 0) / n,
      median: n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2 };
  }).filter(x => x.c).sort((a, b) => b.sum - a.sum);
}

/**
 * Регулярные платежи. Признак — повтор близкой суммы (±15%) в одной категории
 * в разные месяцы. Одного месяца истории не хватает: тогда возвращаем пусто,
 * и экран честно сообщает, что нужен второй месяц.
 */
function recurring() {
  const byCat = {};
  S.tx.forEach(t => {
    if (t.kind !== "expense") return;
    (byCat[t.cat] = byCat[t.cat] || []).push({ v: toBase(t), m: ym(t.date), date: t.date });
  });
  const out = [];
  Object.keys(byCat).forEach(id => {
    const c = cat(id); if (!c) return;
    const items = byCat[id].slice().sort((a, b) => a.v - b.v);
    const used = new Array(items.length).fill(false);
    for (let i = 0; i < items.length; i++) {
      if (used[i]) continue;
      const group = [items[i]];
      for (let j = i + 1; j < items.length; j++) {
        if (used[j]) continue;
        if (items[j].v <= group[0].v * 1.15) { group.push(items[j]); used[j] = true; }
      }
      const months = {}; group.forEach(g => months[g.m] = 1);
      if (Object.keys(months).length >= 2) {
        const sum = group.reduce((a, b) => a + b.v, 0);
        out.push({ c, avg: sum / group.length, times: group.length,
          months: Object.keys(months).length, last: group.map(g => g.date).sort().pop() });
      }
    }
  });
  return out.sort((a, b) => b.avg * b.months - a.avg * a.months);
}

/** Постоянные расходы: обязательные категории по среднему за завершённые месяцы */
function fixedCosts() {
  /* Берём месяцы, в которых обязательные траты реально были. Завершённые —
     в приоритете; если их ещё нет, честно считаем по текущему и помечаем partial. */
  const byMonth = {};
  S.tx.forEach(t => {
    if (t.kind !== "expense") return;
    const c = cat(t.cat); if (!c || !c.fixed) return;
    const m = ym(t.date);
    (byMonth[m] = byMonth[m] || {})[c.id] = (byMonth[m][c.id] || 0) + toBase(t);
  });
  const all = Object.keys(byMonth).sort();
  if (!all.length) return [];
  const cur = ym(todayStr());
  const done = all.filter(m => m !== cur);
  const pick = done.length ? done.slice(-3) : [cur];
  const acc = {};
  pick.forEach(m => Object.keys(byMonth[m]).forEach(id => { acc[id] = (acc[id] || 0) + byMonth[m][id]; }));
  return Object.keys(acc).map(id => ({ c: cat(id), perMonth: acc[id] / pick.length,
    months: pick.length, partial: !done.length })).filter(x => x.c)
    .sort((a, b) => b.perMonth - a.perMonth);
}

/** Рост категорий месяц к месяцу; текущий месяц приводится к полному */
/** Расходы по категориям за дни 1..day включительно */
function catSumsUpto(m, day) {
  const by = {};
  S.tx.forEach(t => {
    if (t.kind !== "expense" || ym(t.date) !== m) return;
    if (+t.date.slice(8, 10) > day) return;
    by[t.cat] = (by[t.cat] || 0) + toBase(t);
  });
  return by;
}

/**
 * Рост категорий: одинаковые окна дней, а не месяц к месяцу.
 *
 * Было: текущий месяц приводился к полному умножением на dm/день.
 * Аренда платится 5-го числа, к 16-му коэффициент 30/16 = 1,88 —
 * и один и тот же платёж показывал рост +58%, хотя к концу месяца
 * разница ноль. Экстраполяция врёт на любом расходе, привязанном
 * к числу месяца: аренда, садик, связь, подписки.
 *
 * Стало: дни 1..N текущего месяца против дней 1..N предыдущего.
 * N — сегодняшнее число для незакрытого месяца, иначе весь месяц.
 * Окно урезается по короткому месяцу: 31 марта против февраля
 * сравнивается по 28 дням с обеих сторон.
 */
function catGrowth(m) {
  const prev = shiftMonth(m, -1);
  const isCur = m === ym(todayStr());
  const day = Math.min(
    isCur ? new Date().getDate() : daysInMonth(m),
    daysInMonth(m), daysInMonth(prev)
  );
  const a = catSumsUpto(prev, day), b = catSumsUpto(m, day);
  if (!Object.keys(a).length) return null;
  const ids = Array.from(new Set(Object.keys(a).concat(Object.keys(b))));
  return { day, full: !isCur && day === daysInMonth(m), rows: ids.map(id => {
    const was = a[id] || 0, now = b[id] || 0;
    return { c: cat(id), was, now, delta: now - was, pct: was > 0 ? (now / was - 1) * 100 : null };
  }).filter(x => x.c && (x.was || x.now)).sort((x, y) => y.delta - x.delta) };
}

/** Доход по источникам за n месяцев, включая текущий */
function incomeMix(n) {
  const from = shiftMonth(ym(todayStr()), -(n - 1));
  const by = {};
  S.tx.forEach(t => {
    if (t.kind !== "income" || ym(t.date) < from) return;
    by[t.cat] = (by[t.cat] || 0) + toBase(t);
  });
  const rows = Object.keys(by).map(id => ({ c: cat(id), v: by[id] })).filter(x => x.c).sort((a, b) => b.v - a.v);
  const total = rows.reduce((s, x) => s + x.v, 0);
  return { rows, total };
}

function budgetTotal() { return S.cats.filter(c => c.kind === "expense").reduce((s, c) => s + (+c.budget || 0), 0); }
function goalSaved(g) {
  return S.tx.filter(t => t.kind === "goal" && t.goal === g.id).reduce((s, t) => s + toBase(t), 0) + (+g.initial || 0);
}
const goalTargetBase = g => (+g.target || 0) * rateOf(g.cur);

/* ==========================================================
   Синхронизация с Google Sheets через Apps Script
   ========================================================== */
const SYNC_TYPES = { account: "accounts", cat: "cats", goal: "goals" };

const SYNC = {
  busy: false,
  configured() { return !!(S.sync && S.sync.url && S.sync.token); },

  async call(method, data) {
    const u = S.sync.url;
    let r;
    if (method === "GET") {
      const q = u + (u.indexOf("?") < 0 ? "?" : "&") +
        "token=" + encodeURIComponent(S.sync.token) + "&since=" + (data.since || 0);
      r = await fetch(q, { method: "GET", redirect: "follow" });
    } else {
      /* text/plain делает запрос «простым» — без preflight,
         на OPTIONS Apps Script не отвечает */
      r = await fetch(u, {
        method: "POST", redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({ token: S.sync.token }, data))
      });
    }
    const text = await r.text();
    try { return JSON.parse(text); }
    catch (e) {
      /* Самый частый случай: в развёртывании стоит доступ «для аккаунтов Google»,
         и вместо JSON приходит страница входа */
      if (/accounts\.google\.com|<!DOCTYPE|<html/i.test(text))
        throw new Error("сервер вернул страницу входа — в развёртывании нужен доступ «Все»");
      throw new Error("сервер ответил не по протоколу");
    }
  },

  /** Причина по-человечески вместо технического текста */
  reason(err) {
    const t = String((err && err.message) || err || "");
    if (/unauthorized/i.test(t)) return "токен не принят сервером";
    if (/страницу входа|не по протоколу/.test(t)) return t;
    /* Chrome — Failed to fetch, Firefox — NetworkError, Safari — Load failed */
    if (/Failed to fetch|NetworkError|Load failed|network|fetch/i.test(t)) return "сервер не ответил";
    if (/Lock|timeout/i.test(t)) return "таблица занята другим устройством";
    return t || "неизвестная ошибка";
  },

  /** Служебные поля наружу не уходят */
  clean(x) { return JSON.stringify(Object.assign({}, x, { dirty: undefined, seed: undefined })); },

  /**
   * Неотправленные изменения.
   * Отбор идёт по флагу, а не по сравнению меток: updatedAt ставят часы устройства,
   * а курсор приходит с часов Google — при расхождении сравнение гнало бы архив в каждый цикл.
   */
  collect() {
    const tx = S.tx.filter(t => t.dirty).map(t => Object.assign({ deleted: 0 }, t));
    const dict = [];
    Object.keys(SYNC_TYPES).forEach(type => {
      (S[SYNC_TYPES[type]] || []).forEach(x => {
        if (x.dirty) dict.push({ id: x.id, type, updatedAt: x.updatedAt, deleted: 0, json: this.clean(x) });
      });
    });
    if (S.settings.dirty)
      dict.push({ id: "settings", type: "settings", updatedAt: S.settings.updatedAt, deleted: 0, json: this.clean(S.settings) });
    Object.keys(S.trash).forEach(k => {
      const e = S.trash[k];
      if (!e || !e.d) return;
      const cut = k.indexOf(":"), type = k.slice(0, cut), id = k.slice(cut + 1);
      if (type === "tx") tx.push({ id, updatedAt: e.t, deleted: 1 });
      else dict.push({ id, type, updatedAt: e.t, deleted: 1, json: "" });
    });
    return { tx, dict };
  },

  /** Снять флаги после подтверждённой отправки */
  clearDirty(payload) {
    const un = (arr, id) => { const o = (arr || []).find(x => x.id === id); if (o) delete o.dirty; };
    payload.tx.forEach(r => { un(S.tx, r.id); const k = "tx:" + r.id; if (S.trash[k]) S.trash[k].d = 0; });
    payload.dict.forEach(r => {
      if (r.type === "settings") { delete S.settings.dirty; return; }
      const key = SYNC_TYPES[r.type];
      if (key) un(S[key], r.id);
      const k = r.type + ":" + r.id; if (S.trash[k]) S.trash[k].d = 0;
    });
  },

  /** Снести записи по умолчанию, если таблица уже наполнена другим устройством */
  dropSeed(pull) {
    const has = t => (pull.dict || []).some(r => String(r.type) === t && !Number(r.deleted));
    if (has("account")) S.accounts = S.accounts.filter(a => !a.seed);
    if (has("cat")) S.cats = S.cats.filter(c => !c.seed);
  },

  /** Приведение типов: из таблицы всё приходит строками и числами вперемешку */
  normTx(r) {
    const num = v => (v === "" || v == null ? undefined : Number(v));
    const str = v => (v === "" || v == null ? undefined : String(v));
    return {
      id: String(r.id), updatedAt: Number(r.updatedAt) || 0, kind: String(r.kind || "expense"),
      date: String(r.date || todayStr()).slice(0, 10), amount: Number(r.amount) || 0,
      cur: CUR[String(r.cur)] ? String(r.cur) : BASE, rate: num(r.rate), acc: str(r.acc), acc2: str(r.acc2),
      amount2: num(r.amount2), cat: str(r.cat), goal: str(r.goal),
      note: r.note == null ? "" : String(r.note)
    };
  },

  /** Слияние: побеждает запись с более поздним updatedAt */
  merge(pull) {
    let n = 0;
    (pull.tx || []).forEach(r => {
      const id = String(r.id), ts = Number(r.updatedAt) || 0;
      const i = S.tx.findIndex(t => t.id === id);
      const localTs = i >= 0 ? (S.tx[i].updatedAt || 0) : ((S.trash["tx:" + id] || {}).t || 0);
      if (ts <= localTs) return;
      if (Number(r.deleted)) { if (i >= 0) S.tx.splice(i, 1); S.trash["tx:" + id] = { t: ts, d: 0 }; }
      else { const o = this.normTx(r); if (i >= 0) S.tx[i] = o; else S.tx.push(o); delete S.trash["tx:" + id]; }
      n++;
    });
    (pull.dict || []).forEach(r => {
      const id = String(r.id), type = String(r.type), ts = Number(r.updatedAt) || 0;
      if (type === "settings") {
        if (ts <= (S.settings.updatedAt || 0)) return;
        try { S.settings = Object.assign(S.settings, JSON.parse(r.json), { updatedAt: ts }); n++; } catch (e) {}
        return;
      }
      const key = SYNC_TYPES[type]; if (!key) return;
      const arr = S[key], i = arr.findIndex(x => x.id === id);
      const localTs = i >= 0 ? (arr[i].updatedAt || 0) : ((S.trash[type + ":" + id] || {}).t || 0);
      if (ts <= localTs) return;
      if (Number(r.deleted)) { if (i >= 0) arr.splice(i, 1); S.trash[type + ":" + id] = { t: ts, d: 0 }; }
      else {
        let o; try { o = JSON.parse(r.json); } catch (e) { return; }
        o.id = id; o.updatedAt = ts;
        if (i >= 0) arr[i] = o; else arr.push(o);
        delete S.trash[type + ":" + id];
      }
      n++;
    });
    return n;
  },

  /**
   * Обмен идёт по одному за раз. Ручной запуск не отказывает, если фоновый ещё
   * в полёте, а дожидается его и делает свой заход — иначе кнопка ругается
   * на собственную фоновую синхронизацию.
   */
  run(opts) {
    opts = opts || {};
    if (!this.configured()) return Promise.resolve({ ok: false, skipped: true, msg: "не настроена" });
    if (this.pending) return opts.manual ? this.pending.then(() => this.run(opts)) : this.pending;
    if (typeof navigator !== "undefined" && navigator.onLine === false)
      return Promise.resolve({ ok: false, skipped: true, msg: "нет сети" });
    this.busy = true;
    syncFlag(true);
    this.pending = this.cycle().finally(() => { this.pending = null; this.busy = false; syncFlag(false); });
    return this.pending;
  },

  /**
   * Курсы приходят в ответе скрипта, потому что сама страница наружу
   * не ходит: у неё CSP без сторонних доменов и обещание «внешних
   * запросов нет». Скрипт дёргает ЦБ Узбекистана раз в сутки.
   * Ручной режим уважается: если автообновление выключено, курс
   * не трогаем.
   */
  applyRates(pull) {
    const r = pull && pull.rates;
    if (!r || !r.rates || S.settings.autoRates === false) return false;
    let changed = false;
    S.settings.rates = S.settings.rates || {};
    CURS.forEach(c => {
      if (c === BASE) return;
      const v = +r.rates[c];
      if (v > 0 && +S.settings.rates[c] !== v) { S.settings.rates[c] = v; changed = true; }
    });
    if (!changed && S.settings.ratesAt === r.at) return false;
    S.settings.ratesAt = r.at || todayStr();
    S.settings.ratesSrc = r.src || "";
    S.settings.rate = +S.settings.rates.USD || 1;
    /* Настройки менялись сервером, а не пользователем: dirty не ставим,
       иначе каждое устройство погонит один и тот же курс обратно в таблицу
       и обмен зациклится на пустых правках. */
    S.settings.updatedAt = Date.now();
    return changed;
  },

  /** Забрать чужое, слить, отдать своё. Курсор двигается только при успехе. */
  async cycle() {
    const since = Number(S.sync.lastSync) || 0;
    const firstRun = !since && S.tx.length === 0;
    try {
      const pull = await this.call("GET", { since });
      if (!pull || !pull.ok) throw new Error((pull && pull.error) || "нет ответа");
      const got = this.merge(pull);
      if (firstRun) this.dropSeed(pull);
      this.applyRates(pull);

      const payload = this.collect();
      let sent = 0;
      if (payload.tx.length || payload.dict.length) {
        const push = await this.call("POST", payload);
        if (!push || !push.ok) throw new Error((push && push.error) || "отказ при отправке");
        this.clearDirty(payload);
        sent = payload.tx.length + payload.dict.length;
        S.sync.lastSync = Number(push.now) || since;
      } else {
        S.sync.lastSync = Number(pull.now) || since;
      }
      S.sync.at = Date.now(); S.sync.status = "ok"; S.sync.err = ""; S.sync.fails = 0;
      store.save(S);
      return { ok: true, got, sent };
    } catch (err) {
      S.sync.fails = (S.sync.fails || 0) + 1;
      S.sync.err = this.reason(err);
      /* Одиночный обрыв на мобильной сети — обычное дело.
         Тревогу поднимаем только когда не проходит три раза подряд. */
      if (S.sync.fails >= 3) S.sync.status = "err";
      store.save(S);
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => {
        this.run().then(r => { if (r.ok) safeRender(); });
      }, Math.min(60000, 10000 * S.sync.fails));
      return { ok: false, msg: S.sync.err, fails: S.sync.fails };
    }
  }
};
